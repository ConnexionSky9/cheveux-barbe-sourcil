<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="app.css" />
  <title>Boutique</title>
</head>
<body>
  <div id="shop" class="shop hidden" role="dialog" aria-modal="true" aria-label="Boutique">
    <aside class="side">
      <div class="brand"><img src="logo.webp" alt="" width="56" height="56" /><div><strong id="server-name">Elyzea</strong><small>Boutique</small></div></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="btn btn-sm btn-ghost" data-view="history">Historique</button>
        <button class="btn btn-sm btn-ghost" data-view="account">Mon compte web</button>
      </div>
    </aside>
    <main class="main">
      <header class="bar">
        <button id="back" class="btn btn-sm btn-ghost hidden">← Retour</button>
        <h1 id="title">Boutique</h1>
        <div class="bar-right"><span id="status" class="badge badge-muted"></span><button id="close" class="btn btn-sm" aria-label="Fermer">Fermer · Échap</button></div>
      </header>
      <section id="content" class="content"></section>
    </main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
