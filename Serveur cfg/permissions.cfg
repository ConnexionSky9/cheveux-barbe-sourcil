add_ace group.admin command allow # allow all commands

# Resources
add_ace resource.elyzea_core command allow

# Ace Groups
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow

# Inheritance
add_principal group.admin group.mod
add_principal group.mod group.support

# Menu staff (admin_menu) : les membres de group.admin (add_principal dans server.cfg) sont Fondateurs,
# même si la liste du staff (admin_menu/data/admins.json) est perdue ou remplacée.
add_ace group.admin adminmenu.fondateur allow
