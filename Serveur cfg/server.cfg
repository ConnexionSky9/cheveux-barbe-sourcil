## =====================================================================
##  ELYZEA FA - server.cfg
##  Les ressources sont rangées par catégorie. L'ordre DANS chaque catégorie
##  et l'ordre des catégories comptent (indiqué en commentaire quand c'est important).
## =====================================================================

## ---------------------------------------------------------------------
##  RÉSEAU ET IDENTITÉ DU SERVEUR
## ---------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
set steam_webApiKey "none"
sets tags "roleplay, elyzea"

# Clé de licence et base de données : dans secrets.cfg (non versionné, voir secrets.cfg.example)
# secrets.cfg doit être DANS LE MÊME DOSSIER que ce server.cfg (ex : D:\txData\Qbox_BE5BF8.base\secrets.cfg)
exec secrets.cfg
sv_hostname "Elyzea FA"
sets sv_projectName "Elyzea FA"
sets sv_projectDesc "Serveur RP Elyzea"
sets locale "root-AQ" # replace with your language and location code, like en-US, pt-BR, etc
load_server_icon myLogo.png
set sv_enforceGameBuild 3258

# Chat (chat système de FiveM)
set resources_useSystemChat true

# Voice config
exec voice.cfg

## ---------------------------------------------------------------------
##  1. BASE ELYZEA (ordre obligatoire)
##  elyzea_core remplace qbx_core, oxmysql, ox_lib et qbx_vehiclekeys
## ---------------------------------------------------------------------
ensure chat
ensure elyzea_core
ensure elyzea_inventory
ensure ely_creator
ensure [voice]
ensure elyzea_radio
ensure admin_menu
ensure elyzea_loadscreen
ensure elyzea_multichar
ensure elyzea_hud

## ---------------------------------------------------------------------
##  2. MAPPING (cartes, intérieurs, MLO)
## ---------------------------------------------------------------------
# Îles et grandes cartes
ensure cayo-perico-ultimate-main
ensure map
ensure as_mapdata
ensure tstudio_zmapdata

# Commissariat, hôpital, mairie
ensure tstudio_mrpd
ensure thunder_medicalcenter
ensure cfx-fm-city-hall-exterior-ls-sub
ensure cfx-fm-city-hall-interior-ls-sub

# Commerces et entreprises
ensure burgershot
ensure Bahama_Mamas
ensure cfx-fm-malibu-club-interior-sub
ensure cfx-fm-beach-club-sub-01
ensure cfx-fm-supermarkets-interior-v2-sub
ensure cfx-fm-ltd-gasoline-interior-sub
ensure cfx-fm-ponsonbys-interior-sub
ensure cfx-fm-ammunation-big-sub
ensure cfx-fm-ammunation-small-sub
ensure cfx-fm-fleeca-banks-v2-sub
ensure cfx-fm-south-side-square-v1-sub

# Bijouterie (Vangelico)
# ATTENTION : deux intérieurs de bijouterie sont chargés en même temps (gigz_jewel_free et cfx-fm-jewelry-interior-sub).
# Deux intérieurs au même endroit peuvent donner des murs / portes transparents : garde-en un seul si c'est le cas.
ensure gigz_jewel_free
ensure cfx-fm-jewelry-interior-sub

# Concessions automobiles
ensure concessfreepatoche
ensure as_autoexotic

# Maisons, villas, lieux privés
ensure villatorrio
ensure desert_mansion
ensure cfx-fm-suburban-interior-sub
ensure cfx-fm-m-houses-01-sub
ensure BlackBunker

# Eau : eau d'origine du jeu + zones ajoutées en jeu (/eau_ajouter, Fondateur). Remplace l'eau du jeu.
ensure elyzea_eau

## ---------------------------------------------------------------------
##  3. VÉHICULES (packs de véhicules ajoutés)
## ---------------------------------------------------------------------
# Véhicules d'urgence : « shared » et « audio » AVANT les véhicules du pack
ensure onx-evp-a-shared
ensure onx-evp-b-audio
ensure onx-evp-d-polscout
ensure gayaems

# Véhicules civils
ensure fcmwi4
ensure 21x90
ensure m3g80
ensure dtmrs6nm
ensure urusperf23
ensure umbuf4bb
ensure elusnon
# royal_amber : décommente si la ressource est dans ton dossier resources
# ensure royal_amber

## ---------------------------------------------------------------------
##  4. VÊTEMENTS
##  Les packs de vêtements toujours AVANT elyzea_clothing (détection automatique).
##  Le plus simple : mettre chaque pack dans resources/[vetements]/ -> rien à ajouter ici
## ---------------------------------------------------------------------
ensure [vetements]
ensure clothes
ensure fsclothes
ensure elyzea_base_hoodie_test
ensure elyzea_vanilla_clothing_test
ensure elyzea_hoodie_base_test
ensure elyzea_staff_assets
ensure elyzea_clothing
# Studio photo des vêtements (/elyzea_photos) : demande la ressource screenshot-basic.
# Décommente les deux lignes si screenshot-basic est dans ton dossier resources.
# ensure screenshot-basic
# ensure elyzea_clothing_photos

## ---------------------------------------------------------------------
##  5. SCRIPTS
## ---------------------------------------------------------------------
# Animations et expressions
ensure rpemotes
ensure elyzea_animations

# Vie quotidienne
ensure elyzea_fuel
ensure elyzea_papiers
ensure elyzea_permis
ensure elyzea_coupes
ensure elyzea_aura

# Métiers (la police AVANT les métiers qui utilisent son menu ALT : EMS, mécano, braquage)
# elyzea_agences AVANT les métiers : plusieurs polices / EMS / mécanos / Dynasty 8 (/agences)
ensure elyzea_agences
ensure elyzea_police
ensure elyzea_ems
ensure elyzea_meca
ensure elyzea_garage
ensure elyzea_dynasty
ensure elyzea_famille
ensure elyzea_casino
ensure pvp_arena
ensure elyzea_animaux
# elyzea_concess : après elyzea_garage
ensure elyzea_concess
# Téléphone de service des métiers (F6) : après tous les métiers
ensure elyzea_jobphone

# Illégal
ensure elyzea_illegal
# elyzea_drogues (drogues : filières, culture, vente, effets) : après elyzea_inventory, elyzea_ems, admin_menu et elyzea_police
ensure elyzea_drogues
# elyzea_tags (graffitis des quartiers) : après elyzea_inventory, admin_menu et elyzea_illegal
ensure elyzea_tags
ensure gofast
# jewelry_heist (braquage de bijouterie) : après elyzea_inventory, elyzea_police et admin_menu
ensure jewelry_heist
# bank_heist (braquage de banque) : après jewelry_heist (il utilise son système de sac)
ensure bank_heist
# noirx (téléphone clandestin NOIR X) : après elyzea_core, elyzea_inventory, admin_menu et elyzea_illegal
ensure noirx

# Ressources désactivées
# p_bridge : demande ox_lib / oxmysql / qbx_core (erreurs au démarrage) et plus aucune ressource ne s'en sert
# ensure p_bridge
# rcore_spray : ressource absente du dossier resources
# ensure rcore_spray

## ---------------------------------------------------------------------
##  PERMISSIONS
## ---------------------------------------------------------------------
add_principal identifier.fivem:15154129 group.admin #VIRTUOZ3
add_principal identifier.discord:1438946071068938311 group.admin #VIRTUOZ3
exec permissions.cfg

# Boutique de vêtements : /boutique_vetements (test) et studio photo /elyzea_photos
add_ace group.admin elyzea.clothing.test allow
add_ace group.admin elyzea.photos allow

## ---------------------------------------------------------------------
##  DIVERS
## ---------------------------------------------------------------------
exec misc.cfg
