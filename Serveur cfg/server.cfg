## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
set steam_webApiKey "none"
sets tags "roleplay, elyzea"

## You MAY edit the following:
# Clé de licence et base de données : dans secrets.cfg (non versionné, voir secrets.cfg.example)
# secrets.cfg doit être DANS LE MÊME DOSSIER que ce server.cfg (ex : D:\txData\Qbox_BE5BF8.base\secrets.cfg)
exec secrets.cfg
sv_hostname "Elyzea FA"
sets sv_projectName "Elyzea FA"
sets sv_projectDesc "Serveur RP Elyzea"
sets locale "root-AQ" # replace with your language and location code, like en-US, pt-BR, etc
load_server_icon myLogo.png
set sv_enforceGameBuild 3258

# Chat (chat système de FiveM)
set resources_useSystemChat true

# Voice config
exec voice.cfg

