<!DOCTYPE html>
<html lang="fr">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;1,600;1,700;1,800;1,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <link rel="stylesheet" href="welcome.css">
    <!-- ely-theme -->
    <meta charset="UTF-8">
    <title>MenuStaff Elyzea FA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="barber.css">
    <link rel="stylesheet" href="market.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="screen">
            <div class="statusbar">
                <img src="logo.png" class="sb-logo" alt="">
                <span class="sb-title">MenuStaff <span>Elyzea</span> FA</span>
                <span class="sb-spacer"></span>
                <button class="sb-duty" id="sb-duty" title="Activer / désactiver tes fonctions staff"></button>
                <span class="sb-item" id="sb-players"></span>
                <span class="sb-item" id="sb-clock"></span>
                <button class="sb-close" id="close-btn" title="Fermer (Échap)">✕</button>
            </div>
            <div class="body">
                <aside class="sidebar">
                    <div class="brand">
                        <img src="logo.png" class="brand-logo" alt="Elyzea">
                        <div class="brand-name">MenuStaff</div>
                        <div class="brand-sub">Elyzea FA</div>
                    </div>
                    <div class="identity">
                        <div class="identity-stripe" id="me-stripe"></div>
                        <div>
                            <div class="identity-label">Connecté en tant que</div>
                            <div class="identity-rank" id="me-rank">—</div>
                        </div>
                    </div>
                    <nav id="tabs"></nav>
                    <div class="sidebar-foot" id="sidebar-foot"></div>
                </aside>
                <main>
                    <header class="topbar"><h1 id="page-title"></h1><p id="page-sub"></p><div id="subnav" class="subnav"></div></header>
                    <section id="content"></section>
                </main>
            </div>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="toasts"></div>
    <div id="announce" class="hidden"></div>
    <div id="warn" class="hidden"></div>
    <div id="station" class="hidden"></div>
    <div id="npc" class="hidden"></div>
    <div id="keyshud" class="hidden"></div>
    <div id="zonemsg" class="hidden"></div>
    <div id="door" class="hidden"></div>
    <div id="doorpanel" class="hidden"></div>
    <div id="jailhud" class="hidden"></div>
    <div id="zombiehud" class="hidden"></div>
    <div id="quick" class="hidden"></div>
    <div id="reporthud" class="hidden" aria-live="polite"></div>
    <div id="pmstack"></div>
    <div id="prompt" class="hidden" aria-live="polite"></div>
    <div id="dprogress" class="hidden"><div class="dp-lab"><b></b><span></span></div><div class="dp-track"><i></i></div><small>X pour annuler</small></div>
    <div id="dprogress" class="hidden"><div class="dp-lab"><b></b><span></span></div><div class="dp-track"><i></i></div><small>X pour annuler</small></div>

    <div id="barber" class="hidden"></div>
    <div id="tattoo" class="hidden"></div>
    <div id="market" class="hidden"></div>
    <script src="catalog.js"></script>
    <script src="script.js"></script>
    <script src="gofast.js"></script>
    <script src="zombies.js"></script>
    <script src="quick.js"></script>
    <script src="permis.js"></script>
    <script src="debts.js"></script>
    <!-- Arrivée en ville : cinématique de bienvenue -->
    <div id="welcome" class="wl hidden">
        <canvas class="wl-fx" id="wlFx"></canvas>
        <div class="wl-black" id="wlBlack"></div>
        <div class="wl-ring" id="wlRing"></div>
        <div class="wl-intro" id="wlIntro">
            <div class="wl-arc"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs>
                <linearGradient id="wlArcG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B2FF7" stop-opacity="0"/><stop offset=".55" stop-color="#B57BFF"/><stop offset="1" stop-color="#F6F2FF"/></linearGradient></defs>
                <path class="a1" d="M1500 160 C 900 40, 160 230, 230 560 C 290 820, 1020 800, 1450 700"/>
                <path class="a2" d="M1420 120 C 820 20, 90 240, 170 590"/></svg></div>
            <div class="wl-mark" id="wlMark"></div>
            <div class="wl-title" id="wlTitle">Bienvenue sur</div>
            <div class="wl-name" id="wlName"></div>
            <div class="wl-underline"></div>
            <div class="wl-city" id="wlCity"></div>
        </div>
        <div class="wl-bars"><i></i><i></i></div>
        <div class="wl-scene hidden" id="wlScene">
            <div class="wl-flare"></div>
            <div class="wl-loc" id="wlLoc"></div>
            <div class="wl-who" id="wlWho"></div>
        </div>
        <div class="wl-outro hidden" id="wlOutro">
            <div class="wl-msg" id="wlMsg"></div>
            <div class="wl-sign" id="wlSign"></div>
        </div>
    </div>

    <script src="respawn.js"></script>
    <script src="brand.js"></script>
    <script src="welcome.js"></script>
    <script src="wipe.js"></script>
    <script src="fuel.js"></script>
    <script src="staffjob.js"></script>
    <script src="trunks.js"></script>
    <script src="drugsale.js"></script>
    <script src="drogues.js"></script>
    <script src="sante.js"></script>
    <script src="sante_actes.js"></script>
    <script src="labs.js"></script>
    <script src="tags.js"></script>
    <script src="guards.js"></script>
    <script src="dynasty.js"></script>
    <script src="dealer.js"></script>
    <script src="club.js"></script>
    <script src="resto.js"></script>
    <script src="builder.js"></script>
    <script src="agences.js"></script>
    <script src="jewelry.js"></script>
    <script src="bankheist.js"></script>
    <script src="noirx.js"></script>
    <script src="famille.js"></script>
    <script src="casino.js"></script>
    <script src="loisirs.js"></script>
    <script src="tv.js"></script>
    <script src="shop.js"></script>
    <script src="animaux.js"></script>
    <script src="pvp.js"></script>
    <script src="lasergame.js"></script>
    <script src="manutention.js"></script>
    <script src="pier.js"></script>
    <script src="presse.js"></script>
    <script src="sharks.js"></script>
    <script src="illegal.js"></script>
    <script src="payui.js"></script>
    <script src="barber.js"></script>
    <script src="tattoo.js"></script>
    <script src="market.js"></script>
    <script src="map.js"></script>
    <script src="vehcustom.js"></script>
    <script src="stashes.js"></script>
    <script src="drops.js"></script>
</body>
</html>
