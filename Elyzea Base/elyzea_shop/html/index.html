<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Boutique Elyzea</title>
</head>
<body>
  <div id="shop" class="shop hidden" role="dialog" aria-modal="true" aria-label="Boutique">
    <aside class="side">
      <div class="brand"><img src="assets/logo.webp" alt="" /><div><strong id="server-name">Elyzea RP</strong><small>Boutique officielle</small></div></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div id="wallet" class="wallet hidden"></div>
        <button class="nav-item" data-view="history">Historique</button>
      </div>
    </aside>
    <main class="main">
      <header class="bar">
        <button id="back" class="btn btn-sm btn-ghost hidden">← Retour</button>
        <h1 id="title">Boutique</h1>
        <button id="close" class="btn btn-sm">Fermer · Échap</button>
      </header>
      <section id="content" class="content"></section>
    </main>
    <div id="modal" class="modal hidden" role="alertdialog" aria-modal="true"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
