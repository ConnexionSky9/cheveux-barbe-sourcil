<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body>
<script>
// Recadre la capture (carré centré), retire le fond vert, redimensionne et encode en webp.
const RES = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'elyzea_clothing_photos';
const work = document.createElement('canvas');
const out = document.createElement('canvas');

window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.action !== 'process') return;
  const img = new Image();
  img.onload = () => {
    const side = Math.round(Math.min(img.width, img.height) * 0.92);
    const sx = Math.round((img.width - side) / 2), sy = Math.round((img.height - side) / 2);
    work.width = work.height = side;
    const w = work.getContext('2d', { willReadFrequently: true });
    w.drawImage(img, sx, sy, side, side, 0, 0, side, side);
    const px = w.getImageData(0, 0, side, side), d = px.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2], mx = Math.max(r, b);
      if (g > 90 && g > mx * 1.35) d[i + 3] = 0;                         // fond vert : transparent
      else if (g > mx) { d[i + 1] = mx; d[i + 3] = Math.min(255, d[i + 3]); } // bords : retire le reflet vert
    }
    w.putImageData(px, 0, 0);
    out.width = out.height = m.size;
    const o = out.getContext('2d');
    o.clearRect(0, 0, m.size, m.size);
    o.imageSmoothingQuality = 'high';
    o.drawImage(work, 0, 0, m.size, m.size);
    const url = out.toDataURL('image/webp', m.quality);
    fetch(`https://${RES}/processed`, { method: 'POST', body: JSON.stringify({ id: m.id, data: url.split(',')[1] || '' }) });
  };
  img.onerror = () => fetch(`https://${RES}/processed`, { method: 'POST', body: JSON.stringify({ id: m.id, data: '' }) });
  img.src = m.data;
});
</script>
</body></html>
