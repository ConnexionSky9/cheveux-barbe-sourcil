<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Elyzea HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
  /* =================================================================
     ELYZEA HUD — futuriste. Mini-carte en bas à gauche (cadre ci-dessous),
     identité + vie + bouclier + faim / soif / voix collés à sa droite.
     Pas de backdrop-filter (FiveM le dessine en carré noir).
     ================================================================= */
  :root{
    --u:calc(100vh/1080);
    --mx:1.4vw;--my:78vh;--mw:15vw;--mh:18.5vh;   /* rectangle de la carte (remplacé par le jeu) */
    --cyan:#22d3ee;--blue:#3b82f6;--text:#e8f1ff;--muted:#8fa3bf;--line:rgba(120,190,255,.18);
    --panel:rgba(6,11,20,.78);--panel2:rgba(10,17,30,.86);
    --hp:#ff3b5c;--hp2:#a3122f;--ar:#3b9bff;--ar2:#1d3f8f;--food:#ffb547;--water:#3fd5ff;--voice:#a78bfa;--ok:#34d399;--warn:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Rajdhani","Segoe UI",Arial,sans-serif;color:var(--text);user-select:none}
  #hud{position:fixed;inset:0;transition:opacity .35s ease;pointer-events:none}
  #hud.hidden{opacity:0}
  .num{font-family:"Chakra Petch","Rajdhani",sans-serif;font-variant-numeric:tabular-nums}

  /* ================= CADRE DE LA MINI-CARTE ================= */
  .frame{position:absolute;left:var(--mx);top:var(--my);width:var(--mw);height:var(--mh);transition:opacity .3s}
  .frame.off{opacity:0}
  .frame::before{content:"";position:absolute;inset:calc(var(--u)*-4);border:calc(var(--u)*1) solid var(--line);
    clip-path:polygon(0 0,calc(100% - var(--u)*16) 0,100% calc(var(--u)*16),100% 100%,calc(var(--u)*16) 100%,0 calc(100% - var(--u)*16));
    box-shadow:0 0 calc(var(--u)*18) rgba(34,211,238,.12),inset 0 0 calc(var(--u)*20) rgba(4,8,16,.55)}
  .frame.round::before{border-radius:50%;clip-path:none}
  .br{position:absolute;width:calc(var(--u)*18);height:calc(var(--u)*18);border:calc(var(--u)*2) solid var(--cyan);filter:drop-shadow(0 0 calc(var(--u)*4) var(--cyan))}
  .b1{left:calc(var(--u)*-6);top:calc(var(--u)*-6);border-right:none;border-bottom:none}
  .b2{right:calc(var(--u)*-6);bottom:calc(var(--u)*-6);border-left:none;border-top:none}
  .frame .tag{position:absolute;left:calc(var(--u)*10);top:calc(var(--u)*-15);font-size:calc(var(--u)*10);letter-spacing:.35em;color:var(--cyan);font-weight:700;
    text-shadow:0 0 calc(var(--u)*6) rgba(34,211,238,.6)}
  .frame.round .br,.frame.round .tag{display:none}
  /* Contour net : bande opaque posée sur le bord de la carte (cache le fondu flou de GTA, 4 px à l'intérieur,
     10 px à l'extérieur), même teinte que les cartes du HUD ; fin liseré cyan à l'intérieur */
  .frame .edge{position:absolute;inset:calc(var(--u)*-10);border:calc(var(--u)*14) solid rgba(6,11,20,.94);
    clip-path:polygon(0 0,calc(100% - var(--u)*20) 0,100% calc(var(--u)*20),100% 100%,calc(var(--u)*20) 100%,0 calc(100% - var(--u)*20));
    box-shadow:inset 0 0 0 calc(var(--u)*1) rgba(120,190,255,.35)}
  .frame.round .edge{border-radius:50%;clip-path:none}

  /* ================= JOUEUR (à droite de la carte) ================= */
  .player{position:absolute;left:calc(var(--mx) + var(--mw) + var(--u)*18);bottom:calc(100vh - var(--my) - var(--mh) - var(--u)*4);
    width:calc(var(--u)*268);display:flex;flex-direction:column;gap:calc(var(--u)*7)}
  #hud.map-right .player{left:auto;right:calc(100vw - var(--mx) + var(--u)*18)}
  .card{position:relative;background:linear-gradient(135deg,var(--panel2),var(--panel));border:calc(var(--u)*1) solid var(--line);
    clip-path:polygon(0 0,calc(100% - var(--u)*12) 0,100% calc(var(--u)*12),100% 100%,0 100%);padding:calc(var(--u)*9) calc(var(--u)*12)}
  .card::after{content:"";position:absolute;left:0;top:0;width:calc(var(--u)*3);height:100%;background:linear-gradient(var(--cyan),var(--blue));box-shadow:0 0 calc(var(--u)*8) var(--cyan)}
  .ident{display:flex;align-items:center;gap:calc(var(--u)*10)}
  .ident .who{flex:1;min-width:0}
  .ident small{display:block;font-size:calc(var(--u)*9.5);letter-spacing:.32em;color:var(--muted);font-weight:700}
  .ident b{display:block;font-family:"Chakra Petch","Rajdhani",sans-serif;font-size:calc(var(--u)*17);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ident b em{font-style:normal;color:var(--cyan)}
  .pid{flex:none;font-family:"Chakra Petch","Rajdhani",sans-serif;font-size:calc(var(--u)*12);font-weight:700;color:var(--cyan);
    border:calc(var(--u)*1) solid rgba(34,211,238,.45);padding:calc(var(--u)*2) calc(var(--u)*8);background:rgba(34,211,238,.08);
    clip-path:polygon(calc(var(--u)*6) 0,100% 0,calc(100% - var(--u)*6) 100%,0 100%)}

  .bars{display:flex;flex-direction:column;gap:calc(var(--u)*7)}
  .bar{display:grid;grid-template-columns:calc(var(--u)*18) 1fr calc(var(--u)*30);align-items:center;gap:calc(var(--u)*8);transition:opacity .3s}
  .bar.off{opacity:.35}
  .bar svg{width:calc(var(--u)*17);height:calc(var(--u)*17);fill:var(--c);filter:drop-shadow(0 0 calc(var(--u)*3) var(--c))}
  .track{position:relative;height:calc(var(--u)*9);background:rgba(4,8,16,.75);border:calc(var(--u)*1) solid rgba(120,190,255,.14);overflow:hidden;
    clip-path:polygon(calc(var(--u)*4) 0,100% 0,calc(100% - var(--u)*4) 100%,0 100%)}
  .fill{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,var(--c2),var(--c));box-shadow:0 0 calc(var(--u)*8) var(--c);
    transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--u)*13),rgba(4,8,16,.85) calc(var(--u)*13) calc(var(--u)*15))}
  .val{text-align:right;font-weight:700;font-size:calc(var(--u)*13)}
  .bar.low .fill{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}

  .needs{display:flex;align-items:center;gap:calc(var(--u)*10)}
  .ring{position:relative;width:calc(var(--u)*40);height:calc(var(--u)*40);flex:none}
  .ring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{fill:rgba(4,8,16,.8);stroke:rgba(120,190,255,.14);stroke-width:3}
  .ring .fg{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-dasharray:100.5;stroke-dashoffset:0;filter:drop-shadow(0 0 2px var(--c));transition:stroke-dashoffset .45s}
  .ring .ic{position:absolute;inset:0;display:grid;place-items:center}
  .ring .ic svg{width:calc(var(--u)*17);height:calc(var(--u)*17);fill:var(--c)}
  .ring.low .fg,.ring.low .ic svg{animation:pulse 1s infinite}
  .ring.talking .bg{stroke:var(--voice);stroke-width:4}
  .ring.talking{filter:drop-shadow(0 0 calc(var(--u)*8) var(--voice))}
  .ring.radio{--c:var(--ok)}
  .vtxt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
  .vtxt b{font-size:calc(var(--u)*13);letter-spacing:.06em}
  .vtxt span{font-size:calc(var(--u)*11);color:var(--muted)}
  .pips{display:flex;gap:calc(var(--u)*3);margin-top:calc(var(--u)*3)}
  .pip{width:calc(var(--u)*12);height:calc(var(--u)*4);background:rgba(120,190,255,.18);transform:skewX(-20deg)}
  .pip.on{background:var(--voice);box-shadow:0 0 calc(var(--u)*5) var(--voice)}

  /* ================= VÉHICULE (bas droite) ================= */
  .veh{position:absolute;right:calc(var(--u)*34);bottom:calc(var(--u)*30);width:calc(var(--u)*250);display:flex;flex-direction:column;align-items:center;transition:opacity .35s,transform .35s}
  #hud.map-right .veh{right:auto;left:calc(var(--u)*34)}
  .veh.off{opacity:0;transform:translateY(calc(var(--u)*16))}
  .where{display:flex;align-items:center;gap:calc(var(--u)*7);font-weight:700;font-size:calc(var(--u)*13);margin-bottom:calc(var(--u)*4);max-width:100%}
  .where .dir{font-family:"Chakra Petch",sans-serif;color:var(--cyan);min-width:calc(var(--u)*22);text-align:center}
  .where .street{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  .dial{position:relative;width:calc(var(--u)*230);height:calc(var(--u)*230)}
  .arcs{position:absolute;inset:0;width:100%;height:100%}
  .arc-bg{fill:none;stroke:rgba(120,190,255,.12)}
  .arc-speed{fill:none;stroke:url(#gSpeed);stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(34,211,238,.6));transition:stroke-dashoffset .15s linear}
  .arc-rpm{fill:none;stroke:var(--blue);transition:stroke-dashoffset .15s linear}
  .arc-rpm.red{stroke:var(--hp)}
  .tick{stroke:rgba(200,225,255,.35)} .tick.major{stroke:rgba(220,240,255,.8)}
  .tlabel{fill:var(--muted);font-size:11px;font-family:"Chakra Petch",sans-serif;text-anchor:middle;dominant-baseline:middle}
  .center{position:absolute;left:0;right:0;top:calc(var(--u)*70);display:flex;flex-direction:column;align-items:center}
  .speed{font-family:"Chakra Petch",sans-serif;font-size:calc(var(--u)*50);font-weight:700;line-height:1;text-shadow:0 0 calc(var(--u)*14) rgba(34,211,238,.45)}
  .unit{font-size:calc(var(--u)*11);letter-spacing:.3em;color:var(--muted)}
  .gear{margin-top:calc(var(--u)*8);min-width:calc(var(--u)*34);text-align:center;font-weight:700;font-size:calc(var(--u)*17);font-family:"Chakra Petch",sans-serif;
    border:calc(var(--u)*1) solid rgba(34,211,238,.45);color:var(--cyan);padding:0 calc(var(--u)*6)}
  .gear.r{color:var(--hp);border-color:var(--hp)}
  .altitude{display:none;margin-top:calc(var(--u)*8);font-weight:700;font-size:calc(var(--u)*15)}
  .altitude.on{display:block} .altitude small{margin-left:calc(var(--u)*4);color:var(--muted);font-size:calc(var(--u)*10)}
  .lamps{position:absolute;left:0;right:0;top:calc(var(--u)*188);display:flex;justify-content:center;gap:calc(var(--u)*8)}
  .lamp{width:calc(var(--u)*18);height:calc(var(--u)*18);opacity:.25;transition:opacity .2s}
  .lamp svg{width:100%;height:100%;fill:var(--text)}
  .lamp.on{opacity:1} .lamp.ind.on svg{fill:var(--ok)} .lamp.lights.on svg{fill:var(--water)} .lamp.lights.high svg{fill:#fff}
  .lamp.engine.on svg{fill:var(--ok)} .lamp.engine.warn svg{fill:var(--warn)} .lamp.engine.bad svg{fill:var(--hp)} .lamp.lock.on svg{fill:var(--warn)}
  @keyframes blink{50%{opacity:.2}} .lamp.ind.on{animation:blink .7s infinite}
  .fuel{display:flex;align-items:center;gap:calc(var(--u)*8);width:calc(var(--u)*210);margin-top:calc(var(--u)*6)}
  .fuel.hide{display:none}
  .fuel svg{width:calc(var(--u)*16);height:calc(var(--u)*16);fill:var(--c)}
  .segs{flex:1;display:flex;gap:calc(var(--u)*3)}
  .seg{flex:1;height:calc(var(--u)*7);background:rgba(120,190,255,.14);transform:skewX(-20deg)}
  .seg.on{background:var(--c);box-shadow:0 0 calc(var(--u)*4) var(--c)}
  .fuel.low .seg.on{animation:pulse 1s infinite}
  .fuel .val{width:calc(var(--u)*40)}

  /* aperçu hors jeu */
  body.demo{background:#3d4a46}
  body.demo .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(35deg,transparent 46%,#cfd8dc 46% 49%,transparent 49%),#8a9aa0}
</style>
</head>
<body>
<div id="hud">
  <div class="frame" id="frame"><i class="edge"></i><i class="br b1"></i><i class="br b2"></i><span class="tag">GPS</span></div>

  <!-- Joueur : identité, vie, bouclier, faim, soif, voix -->
  <div class="player">
    <div class="card ident">
      <div class="who"><small>CITOYEN</small><b id="name">—</b></div>
      <span class="pid num" id="pid">ID —</span>
    </div>
    <div class="card bars">
      <div class="bar" id="b-health" style="--c:var(--hp);--c2:var(--hp2)" title="Vie">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4 0 6.1 4.2 4.6 7.7C19.5 16.4 12 21 12 21z"/></svg>
        <div class="track"><div class="fill"></div></div><div class="val num">100</div>
      </div>
      <div class="bar" id="b-armor" style="--c:var(--ar);--c2:var(--ar2)" title="Bouclier">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.6 8 11 4.6-1.4 8-6 8-11V5z"/></svg>
        <div class="track"><div class="fill"></div></div><div class="val num">0</div>
      </div>
    </div>
    <div class="card needs">
      <div class="ring" id="g-hunger" style="--c:var(--food)" title="Faim">
        <svg class="r" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="16"/><circle class="fg" cx="18" cy="18" r="16"/></svg>
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M7 2v8a2 2 0 0 1-1.5 1.9V22h-2V11.9A2 2 0 0 1 2 10V2h1.5v6h1V2H6v6h1V2zm9 0c2.8 0 4 3 4 7 0 2-1 3.4-2.5 3.8V22h-2.2V2z"/></svg></div>
      </div>
      <div class="ring" id="g-thirst" style="--c:var(--water)" title="Soif">
        <svg class="r" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="16"/><circle class="fg" cx="18" cy="18" r="16"/></svg>
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2s7 7.6 7 13a7 7 0 0 1-14 0c0-5.4 7-13 7-13z"/></svg></div>
      </div>
      <div class="ring" id="g-voice" style="--c:var(--voice)" title="Voix">
        <svg class="r" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="16"/><circle class="fg" cx="18" cy="18" r="16"/></svg>
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5h1.8a7.8 7.8 0 0 1-6.9 7.7V22h-1.8v-2.8a7.8 7.8 0 0 1-6.9-7.7H6a6 6 0 0 0 12 0z"/></svg></div>
      </div>
      <div class="vtxt"><b id="voice-label">Normal</b><span id="voice-dist">Portée 8 m</span>
        <div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div>
    </div>
  </div>

  <!-- Véhicule -->
  <div class="veh off" id="veh">
    <div class="where"><span class="dir" id="dir">N</span><span class="street" id="street"></span></div>
    <div class="dial">
      <svg class="arcs" viewBox="0 0 230 230" aria-hidden="true">
        <defs><linearGradient id="gSpeed" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset=".65" stop-color="#22d3ee"/><stop offset="1" stop-color="#ff3b5c"/></linearGradient></defs>
        <g id="ticks"></g>
        <circle class="arc-bg" cx="115" cy="115" r="96" stroke-width="8"/>
        <circle class="arc-speed" id="arcSpeed" cx="115" cy="115" r="96" stroke-width="8"/>
        <circle class="arc-bg" cx="115" cy="115" r="82" stroke-width="3"/>
        <circle class="arc-rpm" id="arcRpm" cx="115" cy="115" r="82" stroke-width="3"/>
      </svg>
      <div class="center">
        <div class="speed" id="speed">0</div>
        <div class="unit">KM/H</div>
        <div class="gear" id="gear">N</div>
        <div class="altitude" id="alt">0 m<small>ALT.</small></div>
      </div>
      <div class="lamps">
        <span class="lamp ind" id="l-left" title="Clignotant gauche"><svg viewBox="0 0 24 24"><path d="M10 5 3 12l7 7v-4.5h11v-5H10z"/></svg></span>
        <span class="lamp lights" id="l-lights" title="Phares"><svg viewBox="0 0 24 24"><path d="M13 5c4.4 0 8 3.1 8 7s-3.6 7-8 7c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2zM2 7h7v2H2zm0 4h7v2H2zm0 4h7v2H2z"/></svg></span>
        <span class="lamp engine" id="l-engine" title="Moteur"><svg viewBox="0 0 24 24"><path d="M7 5h6v2h-2v2h4l2 2h2V9h2v8h-2v-2h-2l-2 3H8l-2-2H4v2H2V9h2v2h2V9h2V7H7z"/></svg></span>
        <span class="lamp lock" id="l-lock" title="Verrouillage"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg></span>
        <span class="lamp ind" id="l-right" title="Clignotant droit"><svg viewBox="0 0 24 24"><path d="M14 5l7 7-7 7v-4.5H3v-5h11z"/></svg></span>
      </div>
    </div>
    <div class="fuel" id="fuel" style="--c:var(--ok)" title="Essence">
      <svg viewBox="0 0 24 24"><path d="M5 3h9a1 1 0 0 1 1 1v8h1a2 2 0 0 1 2 2v3a1 1 0 0 0 2 0V9.4l-2.7-2.7 1.4-1.4L22 8.6V17a3 3 0 0 1-6 0v-3h-1v7H4V4a1 1 0 0 1 1-1zm1 2v5h7V5z"/></svg>
      <div class="segs" id="segs"></div>
      <div class="val num" id="fuelVal">100 %</div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const hud = $('hud'), frame = $('frame'), root = document.documentElement.style;
  const pips = document.querySelectorAll('.pip');
  const NAMES = { 1: 'Chuchoter', 2: 'Normal', 3: 'Crier' };
  const RING = 100.5;   // circonférence (r = 16)
  const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, Math.round(v ?? 0)));

  /* ---------- Joueur ---------- */
  function bar(id, value, lowAt = 25) {
    const el = $(id), v = clamp(value);
    el.querySelector('.fill').style.width = v + '%';
    el.querySelector('.val').textContent = v;
    if (id === 'b-armor') el.classList.toggle('off', v === 0);
    else el.classList.toggle('low', v <= lowAt);
  }
  function ring(id, value, lowAt = 20) {
    const el = $(id), v = clamp(value);
    el.querySelector('.fg').style.strokeDashoffset = String(RING * (1 - v / 100));
    el.classList.toggle('low', v <= lowAt);
    el.title = `${el.title.split(' ')[0]} ${v} %`;
  }
  function voice(mode = 2, distance, talking, radio) {
    const g = $('g-voice');
    g.querySelector('.fg').style.strokeDashoffset = String(RING * (1 - mode / 3));
    g.classList.toggle('talking', !!talking);
    g.classList.toggle('radio', !!radio);
    pips.forEach((p, i) => p.classList.toggle('on', i < mode));
    $('voice-label').textContent = radio ? 'Radio' : (NAMES[mode] || 'Normal');
    $('voice-dist').textContent = distance != null ? `Portée ${Math.round(distance)} m` : '';
  }
  function ident(d) {
    const first = d.firstname || '', last = (d.lastname || '').toUpperCase();
    const n = $('name');
    n.innerHTML = '';
    const em = document.createElement('em'); em.textContent = first;
    n.append(em, document.createTextNode(first && last ? ' ' + last : last));
    if (!first && !last) n.textContent = '—';
    $('pid').textContent = d.id != null ? `ID ${d.id}` : 'ID —';
  }
  function setRect(r) {
    if (!r || !(r.w > 0)) return;
    root.setProperty('--mx', (r.x * 100) + 'vw');
    root.setProperty('--my', (r.y * 100) + 'vh');
    root.setProperty('--mw', (r.w * 100) + 'vw');
    root.setProperty('--mh', (r.h * 100) + 'vh');
    frame.classList.toggle('round', !!r.round);
    hud.classList.toggle('map-right', String(r.align || '').charAt(0) === 'R');
  }

  /* ---------- Véhicule ---------- */
  const R1 = 96, R2 = 82, SWEEP = 0.75;            // arc de 270°
  const C1 = 2 * Math.PI * R1, C2 = 2 * Math.PI * R2;
  const arcS = $('arcSpeed'), arcR = $('arcRpm');
  for (const [el, c] of [[arcS, C1], [arcR, C2]]) {
    el.setAttribute('stroke-dasharray', `${c * SWEEP} ${c}`);
    el.setAttribute('transform', 'rotate(135 115 115)');
  }
  document.querySelectorAll('.arc-bg').forEach((el) => {
    const c = 2 * Math.PI * Number(el.getAttribute('r'));
    el.setAttribute('stroke-dasharray', `${c * SWEEP} ${c}`);
    el.setAttribute('transform', 'rotate(135 115 115)');
  });
  for (let i = 0; i < 10; i++) { const s = document.createElement('i'); s.className = 'seg'; $('segs').appendChild(s); }
  const segs = document.querySelectorAll('.seg');

  let scaleMax = 0;
  function drawTicks(max) {
    if (max === scaleMax) return;
    scaleMax = max;
    const g = $('ticks'); g.innerHTML = '';
    const step = max <= 200 ? 20 : max <= 320 ? 40 : 50;
    const ns = 'http://www.w3.org/2000/svg';
    for (let v = 0; v <= max; v += step / 2) {
      const major = v % step === 0;
      const a = (135 + (v / max) * 270) * Math.PI / 180;
      const r0 = 108, r1 = major ? 101 : 104;
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', 115 + r0 * Math.cos(a)); l.setAttribute('y1', 115 + r0 * Math.sin(a));
      l.setAttribute('x2', 115 + r1 * Math.cos(a)); l.setAttribute('y2', 115 + r1 * Math.sin(a));
      l.setAttribute('class', 'tick' + (major ? ' major' : '')); l.setAttribute('stroke-width', major ? 2 : 1);
      g.appendChild(l);
      if (major) {
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', 115 + 68 * Math.cos(a)); t.setAttribute('y', 115 + 68 * Math.sin(a));
        t.setAttribute('class', 'tlabel'); t.textContent = v;
        g.appendChild(t);
      }
    }
  }

  function vehicle(v) {
    $('veh').classList.toggle('off', !v);
    if (!v) return;
    drawTicks(v.max || 200);
    const sp = Math.max(0, Math.round(v.speed || 0));
    $('speed').textContent = sp;
    arcS.setAttribute('stroke-dashoffset', C1 * SWEEP * (1 - Math.min(1, sp / scaleMax)));
    const rpm = Math.max(0, Math.min(1, v.rpm || 0));
    arcR.setAttribute('stroke-dashoffset', C2 * SWEEP * (1 - rpm));
    arcR.classList.toggle('red', rpm > 0.9);
    const gear = $('gear');
    gear.textContent = v.gear ?? 'N';
    gear.classList.toggle('r', v.gear === 'R');
    gear.style.display = v.air ? 'none' : '';
    $('alt').classList.toggle('on', !!v.air);
    if (v.air) $('alt').firstChild.textContent = `${Math.round(v.altitude || 0)} m`;
    $('l-left').classList.toggle('on', !!v.left);
    $('l-right').classList.toggle('on', !!v.right);
    const lt = $('l-lights'); lt.classList.toggle('on', !!v.lights); lt.classList.toggle('high', !!v.high);
    const en = $('l-engine');
    en.classList.toggle('on', !!v.engineOn);
    en.classList.toggle('warn', v.engine < 60 && v.engine >= 30);
    en.classList.toggle('bad', v.engine < 30);
    en.title = `Moteur ${clamp(v.engine)} %`;
    $('l-lock').classList.toggle('on', !!v.locked);
    const f = $('fuel');
    f.classList.toggle('hide', v.fuel == null);
    if (v.fuel != null) {
      const fv = clamp(v.fuel), n = Math.ceil(fv / 10);
      segs.forEach((s, i) => s.classList.toggle('on', i < n));
      $('fuelVal').textContent = fv + ' %';
      f.style.setProperty('--c', fv <= 15 ? 'var(--hp)' : fv <= 30 ? 'var(--warn)' : 'var(--ok)');
      f.classList.toggle('low', fv <= 15);
    }
    $('dir').textContent = v.dir || '';
    $('street').textContent = v.street || '';
  }

  function update(d) {
    if ('health' in d) bar('b-health', d.health);
    if ('armor' in d) bar('b-armor', d.armor);
    if ('hunger' in d) ring('g-hunger', d.hunger);
    if ('thirst' in d) ring('g-thirst', d.thirst);
    if ('voice' in d) voice(d.voice.mode, d.voice.distance, d.talking, d.radio);
    if ('show' in d) hud.classList.toggle('hidden', !d.show);
    if ('map' in d) frame.classList.toggle('off', !d.map);
    if ('vehicle' in d) vehicle(d.vehicle);
  }

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'update') update(d);
    else if (d.action === 'vehicle') vehicle(d.vehicle);
    else if (d.action === 'rect') setRect(d.rect);
    else if (d.action === 'ident') ident(d);
  });
})();
</script>
</body>
</html>
