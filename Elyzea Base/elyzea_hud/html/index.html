<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elyzea HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* 1 unité = 1 px en 1080p : s'adapte à toutes les résolutions */
    --u: calc(100vh / 1080);
    --gold:#E7CF9A; --gold-deep:#A8823F; --cream:#FBF1DC; --navy:#0A1426;
    --health:#FF3346; --armor:#3E86FF; --hunger:#F0A63A; --thirst:#8FD0F5; --voice:#E7CF9A;
    /* Position de la mini-carte (remplie par le jeu, valeurs de secours = bas gauche) */
    --mx: 1.4vw; --my: calc(100vh - 3vh - 18.5vh); --mw: 16.65vw; --mh: 18.5vh;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:"Rajdhani","Segoe UI",Arial,sans-serif;color:var(--cream);user-select:none}
  #hud{position:fixed;inset:0;transition:opacity .35s ease}
  #hud.hidden{opacity:0}

  /* ================= CADRE DE LA MINI-CARTE ================= */
  .frame{position:absolute;left:var(--mx);top:var(--my);width:var(--mw);height:var(--mh);pointer-events:none;
    transition:opacity .3s}
  .frame.off{opacity:0}
  .frame::before{content:"";position:absolute;inset:calc(var(--u)*-3);
    border:calc(var(--u)*1.5) solid rgba(231,207,154,.55);
    box-shadow:0 0 0 calc(var(--u)*1) rgba(6,12,24,.85),0 calc(var(--u)*6) calc(var(--u)*18) rgba(0,0,0,.45),inset 0 0 calc(var(--u)*14) rgba(6,12,24,.55)}
  .frame.round::before{border-radius:50%}
  .corner{position:absolute;width:calc(var(--u)*16);height:calc(var(--u)*16);border:calc(var(--u)*2.5) solid var(--gold);
    filter:drop-shadow(0 0 calc(var(--u)*4) rgba(231,207,154,.6))}
  .c1{left:calc(var(--u)*-5);top:calc(var(--u)*-5);border-right:none;border-bottom:none}
  .c2{right:calc(var(--u)*-5);top:calc(var(--u)*-5);border-left:none;border-bottom:none}
  .c3{left:calc(var(--u)*-5);bottom:calc(var(--u)*-5);border-right:none;border-top:none}
  .c4{right:calc(var(--u)*-5);bottom:calc(var(--u)*-5);border-left:none;border-top:none}
  .frame.round .corner{display:none}
  .edge{position:absolute;left:0;right:0;bottom:calc(var(--u)*-6);height:calc(var(--u)*2);
    background:linear-gradient(90deg,#3E86FF,var(--gold) 50%,#FF3346);opacity:.85}
  .frame.round .edge{display:none}

  /* ================= STATUTS (collés à droite de la carte) ================= */
  .status{position:absolute;left:calc(var(--mx) + var(--mw) + var(--u)*14);
    bottom:calc(100vh - var(--my) - var(--mh) - var(--u)*3);
    width:calc(var(--u)*196);display:flex;flex-direction:column;gap:calc(var(--u)*7)}

  .bar{display:flex;align-items:center;gap:calc(var(--u)*7);height:calc(var(--u)*16);transition:opacity .3s}
  .bar.off{opacity:.3}
  .ico{flex:none;width:calc(var(--u)*16);height:calc(var(--u)*16);display:grid;place-items:center}
  .ico svg{width:100%;height:100%;fill:var(--c);filter:drop-shadow(0 0 calc(var(--u)*3) var(--c)) drop-shadow(0 calc(var(--u)*1) calc(var(--u)*1) #000)}
  .track{flex:1;height:calc(var(--u)*7);position:relative;background:rgba(6,12,24,.7);
    border:calc(var(--u)*1) solid rgba(231,207,154,.18);border-radius:calc(var(--u)*4);overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;width:100%;border-radius:inherit;
    background:linear-gradient(90deg,var(--c2),var(--c));box-shadow:0 0 calc(var(--u)*8) var(--c);
    transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .val{flex:none;width:calc(var(--u)*26);text-align:right;font-weight:700;font-size:calc(var(--u)*13);
    font-variant-numeric:tabular-nums;text-shadow:0 calc(var(--u)*1) calc(var(--u)*2) #000}
  .bar.low .fill{animation:pulse 1s ease-in-out infinite}
  .bar.low .val{color:var(--health)}
  @keyframes pulse{50%{opacity:.35}}

  .gauges{display:flex;align-items:center;gap:calc(var(--u)*9);margin-top:calc(var(--u)*2)}
  .gauge{--p:100;position:relative;width:calc(var(--u)*34);height:calc(var(--u)*34);border-radius:50%;
    background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(6,12,24,.75) 0);
    box-shadow:0 0 calc(var(--u)*8) rgba(0,0,0,.5);transition:--p .4s}
  .gauge::before{content:"";position:absolute;inset:calc(var(--u)*3);border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#16274a,var(--navy));border:calc(var(--u)*1) solid rgba(231,207,154,.25)}
  .gauge svg{position:absolute;inset:0;margin:auto;width:calc(var(--u)*15);height:calc(var(--u)*15);fill:var(--c);
    filter:drop-shadow(0 0 calc(var(--u)*3) var(--c))}
  .gauge.low{animation:pulse 1s ease-in-out infinite}
  .gauge.talking::before{border-color:var(--cream);box-shadow:0 0 calc(var(--u)*10) var(--cream)}
  .gauge.radio{--c:#FF3346 !important}
  .voice-txt{display:flex;flex-direction:column;line-height:1.05}
  .voice-txt b{font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:calc(var(--u)*11.5);letter-spacing:.06em;color:var(--gold);
    text-shadow:0 calc(var(--u)*1) calc(var(--u)*2) #000}
  .voice-txt span{font-weight:700;font-size:calc(var(--u)*12);font-variant-numeric:tabular-nums;text-shadow:0 calc(var(--u)*1) calc(var(--u)*2) #000}
  .pips{display:flex;gap:calc(var(--u)*3);margin-top:calc(var(--u)*3)}
  .pip{width:calc(var(--u)*7);height:calc(var(--u)*3);border-radius:calc(var(--u)*2);background:rgba(231,207,154,.2)}
  .pip.on{background:var(--gold)}

  .brand{position:absolute;right:calc(var(--u)*22);bottom:calc(var(--u)*18);font-weight:600;font-size:calc(var(--u)*15);
    color:#e6e6e6;opacity:.55;text-shadow:0 0 calc(var(--u)*2) #000}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  body.demo{background:radial-gradient(ellipse at 30% 60%,#3b4a3a,#1d2620 60%,#0d120f)}
  body.demo .frame::after{content:"";position:absolute;inset:0;background:
    linear-gradient(35deg,transparent 46%,#d9d9d9 46% 49%,transparent 49%),linear-gradient(-50deg,transparent 30%,#cfcfcf 30% 33%,transparent 33%),#9a9a9a}
</style>
</head>
<body>
<div id="hud">
  <div class="brand">Elyzea FA</div>

  <div class="frame" id="frame">
    <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><i class="edge"></i>
  </div>

  <div class="status">
    <div class="bar" id="b-health" style="--c:var(--health);--c2:#8e1420">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4 0 6.1 4.2 4.6 7.7C19.5 16.4 12 21 12 21z"/></svg></div>
      <div class="track"><div class="fill"></div></div><div class="val">100</div>
    </div>
    <div class="bar" id="b-armor" style="--c:var(--armor);--c2:#1c3f80">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.6 8 11 4.6-1.4 8-6 8-11V5z"/></svg></div>
      <div class="track"><div class="fill"></div></div><div class="val">100</div>
    </div>
    <div class="gauges">
      <div class="gauge" id="g-hunger" style="--c:var(--hunger)"><svg viewBox="0 0 24 24"><path d="M7 2v8a2 2 0 0 1-1.5 1.9V22h-2V11.9A2 2 0 0 1 2 10V2h1.5v6h1V2H6v6h1V2zm9 0c2.8 0 4 3 4 7 0 2-1 3.4-2.5 3.8V22h-2.2V2z"/></svg></div>
      <div class="gauge" id="g-thirst" style="--c:var(--thirst)"><svg viewBox="0 0 24 24"><path d="M12 2s7 7.6 7 13a7 7 0 0 1-14 0c0-5.4 7-13 7-13z"/></svg></div>
      <div class="gauge" id="g-voice" style="--c:var(--voice)"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5h1.8a7.8 7.8 0 0 1-6.9 7.7V22h-1.8v-2.8a7.8 7.8 0 0 1-6.9-7.7H6a6 6 0 0 0 12 0z"/></svg></div>
      <div class="voice-txt"><b id="voice-label">Normal</b><span id="voice-dist">8 m</span>
        <div class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div></div>
    </div>
  </div>
</div>

<script>
(() => {
  const hud = document.getElementById('hud');
  const frame = document.getElementById('frame');
  const root = document.documentElement.style;
  const pips = document.querySelectorAll('.pip');
  const NAMES = { 1: 'Chuchoter', 2: 'Normal', 3: 'Crier' };
  const clamp = (v) => Math.max(0, Math.min(100, Math.round(v ?? 0)));

  function bar(id, value, lowAt = 25) {
    const el = document.getElementById(id), v = clamp(value);
    el.querySelector('.fill').style.width = v + '%';
    el.querySelector('.val').textContent = v;
    if (id === 'b-armor') el.classList.toggle('off', v === 0);
    else el.classList.toggle('low', v <= lowAt);
  }
  function gauge(id, value, lowAt = 20) {
    const el = document.getElementById(id), v = clamp(value);
    el.style.setProperty('--p', v);
    el.classList.toggle('low', v <= lowAt);
  }
  function voice(mode = 2, distance, talking, radio) {
    const g = document.getElementById('g-voice');
    g.style.setProperty('--p', Math.round(mode / 3 * 100));
    g.classList.toggle('talking', !!talking);
    g.classList.toggle('radio', !!radio);
    pips.forEach((p, i) => p.classList.toggle('on', i < mode));
    document.getElementById('voice-label').textContent = radio ? 'Radio' : (NAMES[mode] || 'Normal');
    document.getElementById('voice-dist').textContent = distance != null ? Math.round(distance) + ' m' : '';
  }
  function setRect(r) {
    if (!r || !(r.w > 0)) return;
    root.setProperty('--mx', (r.x * 100) + 'vw');
    root.setProperty('--my', (r.y * 100) + 'vh');
    root.setProperty('--mw', (r.w * 100) + 'vw');
    root.setProperty('--mh', (r.h * 100) + 'vh');
    frame.classList.toggle('round', !!r.round);
  }
  function update(d) {
    if ('health' in d) bar('b-health', d.health);
    if ('armor' in d) bar('b-armor', d.armor);
    if ('hunger' in d) gauge('g-hunger', d.hunger);
    if ('thirst' in d) gauge('g-thirst', d.thirst);
    if ('voice' in d) voice(d.voice.mode, d.voice.distance, d.talking, d.radio);
    if ('show' in d) hud.classList.toggle('hidden', !d.show);
    if ('map' in d) frame.classList.toggle('off', !d.map);
  }

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'update') update(d);
    if (d.action === 'rect') setRect(d.rect);
  });

  // ---- Aperçu hors FiveM ----
  if (typeof GetParentResourceName === 'undefined') {
    document.body.classList.add('demo');
    const s = { health: 82, armor: 46, hunger: 64, thirst: 18 };
    update({ ...s, map: true, voice: { mode: 2, distance: 8 } });
  }
})();
</script>
</body>
</html>
