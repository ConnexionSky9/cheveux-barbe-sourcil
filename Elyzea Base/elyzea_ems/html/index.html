<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elyzea · Tablette EMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D8B46A;--gold-hi:#F6E3B4;--gold-lo:#8A6A2E;
  --navy:#08111F;--panel:#0D1A2E;--panel-2:#132440;--line:rgba(216,180,106,.2);
  --text:#E9E4D6;--muted:#8E97A8;--blue:#3D86FF;--cross:#E85A5A;--ok:#4CC38A;
  --serif:'Cinzel',Georgia,serif;--sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:transparent;color:var(--text);font:15px/1.5 var(--sans);overflow:hidden}
html.preview body{background:#000 radial-gradient(ellipse at 50% 0%,rgba(61,134,255,.16),transparent 60%)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.hidden{display:none!important}

/* ---- Tablette ---- */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.tablet{width:min(1180px,100%);aspect-ratio:16/10.4;max-height:100%;padding:22px;border-radius:38px;position:relative;
  background:linear-gradient(145deg,#2a2418,#0b0a08 30%,#15120c 70%,#3a3020);
  box-shadow:0 0 0 2px var(--gold-lo),0 0 0 3px #000,0 30px 80px -20px rgba(61,134,255,.45),inset 0 0 0 1px rgba(246,227,180,.25)}
.tablet::before{content:"";position:absolute;top:50%;left:9px;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#1b2a44;box-shadow:0 0 0 1px #000,inset 0 0 2px var(--blue)}
.screen{height:100%;border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;background:linear-gradient(180deg,var(--panel),var(--navy));box-shadow:inset 0 0 0 1px #000;position:relative}
.status{display:flex;align-items:center;gap:14px;padding:6px 18px;font:600 13px var(--cond);color:var(--muted);background:rgba(0,0,0,.35);letter-spacing:.04em}
.status .mid{flex:1;text-align:center;color:var(--gold);font-family:var(--serif);font-size:12px;letter-spacing:.2em}
.batt{width:24px;height:11px;border:1px solid var(--muted);border-radius:2px;position:relative;padding:1px}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:var(--muted)}
.batt i{display:block;height:100%;width:64%;background:var(--gold)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:0}
nav{border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(0,0,0,.22);min-height:0}
.me{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.me img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 1px var(--gold-lo)}
.me b{display:block;font-weight:600;line-height:1.2}
.me span{font:500 13px var(--cond);color:var(--gold)}
.menu{list-style:none;margin:0;padding:10px 8px;flex:1;overflow-y:auto}
.menu button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--muted);font:600 15px var(--cond);text-align:left}
.menu svg,.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menu button:hover{color:var(--text);background:rgba(255,255,255,.03)}
.menu button[aria-current="page"]{color:var(--gold-hi);background:linear-gradient(90deg,rgba(216,180,106,.16),rgba(61,134,255,.06));box-shadow:inset 2px 0 0 var(--gold)}
.menu .sep{font:600 12px var(--cond);color:var(--gold-lo);padding:14px 12px 4px;letter-spacing:.06em}
.duty{margin:10px 12px 14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;gap:10px;background:none;cursor:pointer;text-align:left}
.duty i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.duty.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.duty b{display:block;font-size:14px}.duty small{color:var(--muted);font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:flex-end;gap:16px;padding:20px 26px 14px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font:700 26px/1.1 var(--serif);color:var(--gold-hi)}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.head .tools{margin-left:auto;display:flex;gap:8px}
.body{flex:1;overflow-y:auto;padding:20px 26px 26px}
h3{font:700 16px var(--serif);color:var(--gold);margin:24px 0 12px;letter-spacing:.04em}
h3:first-child{margin-top:0}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 12px;max-width:70ch}
.chip{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;color:var(--gold);cursor:pointer;font:600 14px var(--cond);white-space:nowrap}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.red{color:var(--cross);border-color:rgba(232,90,90,.35)}
.btn{border-radius:10px;padding:11px 20px;cursor:pointer;font:700 14px var(--serif);letter-spacing:.06em;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));color:#1A1206;border:1px solid var(--gold-hi)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
input[type=text],input[type=number],select{width:100%;background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,134,255,.2)}
label.l{display:block;font:600 13px var(--cond);color:var(--gold);margin-bottom:5px}
.empty{color:var(--muted);padding:14px 0}

/* Accueil */
.hero{display:flex;align-items:center;gap:22px;padding:20px 22px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(110deg,rgba(61,134,255,.12),transparent 60%)}
.crossmark{width:58px;height:58px;flex:none;position:relative;border-radius:14px;border:1px solid var(--gold-lo);background:var(--navy)}
.crossmark::before,.crossmark::after{content:"";position:absolute;background:var(--cross);border-radius:2px;box-shadow:0 0 14px rgba(232,90,90,.5)}
.crossmark::before{left:24px;top:12px;width:10px;height:34px}.crossmark::after{left:12px;top:24px;width:34px;height:10px}
.hero h2{margin:0;font:700 22px var(--serif);color:var(--gold-hi)}
.hero p{margin:2px 0 0;color:var(--muted)}
.stats{display:flex;gap:28px;margin-left:auto;flex-wrap:wrap}
.stat b{display:block;font:700 26px/1 var(--serif)}
.stat span{font:500 13px var(--cond);color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.key{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.key b{display:block;margin-bottom:4px}
.key p{margin:0;color:var(--muted);font-size:14px}
kbd{display:inline-block;min-width:26px;text-align:center;padding:1px 7px;border-radius:6px;border:1px solid var(--gold-lo);border-bottom-width:2px;font:600 13px var(--cond);color:var(--gold-hi);background:var(--navy);margin-right:6px}

/* Listes */
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(216,180,106,.07)}
.row:last-child{border-bottom:0}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted);font:500 13px var(--cond)}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4558;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tag{font:600 12px var(--cond);padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.duty{color:var(--ok);border-color:rgba(76,195,138,.4)}
.ghead{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.ghead:first-child{margin-top:0}
.ghead b{font:700 15px var(--serif);color:var(--gold-hi)}
.ghead.top b{color:var(--gold)}
.ghead span{color:var(--muted);font:500 13px var(--cond)}
.ghead .sal{margin-left:auto}
.mini{background:none;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--gold);display:grid;place-items:center}
.mini:hover:not(:disabled){border-color:var(--gold)}
.mini:disabled{opacity:.3;cursor:not-allowed}
.mini.red{color:var(--cross)}

/* Facturer */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fees{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fee{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:none;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:8px}
.fee b{font-weight:500}.fee span{color:var(--gold);font-weight:600;white-space:nowrap}
.fee[aria-pressed="true"]{border-color:var(--gold);background:rgba(216,180,106,.08)}
.pick{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:none;cursor:pointer;text-align:left;width:100%;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pick[aria-pressed="true"]{border-color:var(--blue);background:rgba(61,134,255,.1)}
.pick small{color:var(--muted);margin-left:auto;font:500 13px var(--cond)}
.summary{margin-top:16px;padding:16px;border:1px solid var(--gold-lo);border-radius:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.summary .amt{font:700 26px var(--serif);color:var(--gold-hi)}
.summary p{margin:0;color:var(--muted);font-size:14px;flex:1;min-width:180px}

/* Finances */
.fin{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px}
.card small{color:var(--muted);font:500 13px var(--cond)}
.card b{display:block;font:700 28px/1.2 var(--serif);margin-top:2px}
.card.main{background:linear-gradient(130deg,rgba(216,180,106,.14),transparent 70%);border-color:var(--gold-lo)}
.card.main b{color:var(--gold-hi);font-size:32px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:14px 14px 0;border:1px solid var(--line);border-radius:12px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));min-height:3px}
.bar.today i{background:linear-gradient(180deg,#8fb8ff,var(--blue))}
.bar em{font:600 12px var(--cond);color:var(--text);font-style:normal}
.bar span{font:500 12px var(--cond);color:var(--muted);padding-bottom:8px}
.move{display:flex;gap:8px;margin-top:10px}
.move input{flex:1}
.amount.in{color:var(--ok)}.amount.out{color:var(--cross)}

/* Accès */
.perm{border:1px solid var(--line);border-radius:12px;overflow:auto}
.perm table{border-collapse:collapse;width:100%;min-width:760px}
.perm th,.perm td{padding:10px 8px;border-bottom:1px solid rgba(216,180,106,.07);text-align:center}
.perm thead th{position:sticky;top:0;background:#0b1626;font:600 13px var(--cond);color:var(--gold);vertical-align:bottom;z-index:1}
.perm thead th.dir{color:var(--gold-hi)}
.perm thead th button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:2px 4px;border-radius:6px;line-height:1.2}
.perm thead th button:hover{background:rgba(216,180,106,.08)}
.perm th.lab,.perm td.lab{text-align:left;min-width:210px}
.perm thead th:not(.lab){min-width:82px}
.perm td.lab b{display:block;font-weight:600}
.perm td.lab small{color:var(--muted);font-size:13px}
.perm tr.grp td{background:rgba(0,0,0,.25);font:700 14px var(--serif);color:var(--gold);text-align:left;padding:8px 14px}
.perm tbody tr:last-child td{border-bottom:0}
.tick{width:26px;height:26px;border-radius:7px;border:1px solid var(--gold-lo);background:var(--navy);cursor:pointer;display:inline-grid;place-items:center;color:#1A1206;padding:0}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-checked="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold-hi)}
.tick[aria-checked="true"] svg{opacity:1}
.tick:disabled{cursor:not-allowed;opacity:.75}
.savebar{position:sticky;bottom:-26px;margin:16px -26px -26px;padding:12px 26px;background:linear-gradient(180deg,rgba(8,17,31,.6),#08111F 40%);display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
.savebar p{margin:0 auto 0 0;color:var(--muted);font-size:14px}
.savebar.dirty p{color:var(--gold-hi)}

/* ---- Interface en jeu ---- */
.alt{position:fixed;left:50%;top:50%;transform:translate(24px,-50%);width:290px;border-radius:16px;background:linear-gradient(180deg,rgba(13,26,46,.97),rgba(8,17,31,.97));box-shadow:0 0 0 1px var(--gold-lo),0 0 0 2px #000,0 16px 40px -8px rgba(0,0,0,.7);overflow:hidden;z-index:6}
.alt header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.alt header .st{width:10px;height:10px;border-radius:50%;flex:none}
.alt header b{display:block;font:700 15px var(--serif);color:var(--gold-hi)}
.alt header small{color:var(--muted);font:500 13px var(--cond)}
.hp{height:4px;background:#1b2638;border-radius:4px;margin-top:6px;overflow:hidden}.hp i{display:block;height:100%;background:var(--ok)}
.alt ul{list-style:none;margin:0;padding:6px}
.alt li button{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:none;border:0;cursor:pointer;text-align:left}
.alt li button:hover:not(:disabled){background:rgba(216,180,106,.1)}
.alt li button:disabled{opacity:.45;cursor:not-allowed}
.alt .oi{width:34px;height:34px;border-radius:9px;border:1px solid var(--gold-lo);display:grid;place-items:center;color:var(--gold);flex:none}
.alt .oi.red{color:var(--cross);border-color:rgba(232,90,90,.5)}
.alt li b{display:block;font-weight:600}.alt li small{color:var(--muted);font:500 12px var(--cond)}
.alt li .t{margin-left:auto;font:600 13px var(--cond);color:var(--gold)}
.alt footer{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font:500 12px var(--cond)}

.prog{position:fixed;left:50%;bottom:calc(14% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(380px,86vw);z-index:6;text-align:center}
.prog .lab{display:flex;justify-content:space-between;font:700 14px var(--serif);color:var(--gold-hi);letter-spacing:.05em;margin-bottom:6px;text-shadow:0 1px 3px #000}
.prog .lab span{font:600 13px var(--cond);color:var(--text)}
.prog .track{height:10px;border-radius:10px;background:rgba(8,17,31,.9);box-shadow:0 0 0 1px var(--gold-lo),0 0 0 2px #000;overflow:hidden}
.prog .fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi))}
.prog small{display:block;margin-top:6px;color:var(--muted);font:500 12px var(--cond);text-shadow:0 1px 3px #000}

.report{position:fixed;right:max(24px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:min(340px,92vw);border-radius:16px;background:linear-gradient(180deg,rgba(13,26,46,.97),rgba(8,17,31,.97));box-shadow:0 0 0 1px var(--gold-lo),0 0 0 2px #000,0 16px 40px -8px rgba(0,0,0,.7);z-index:6;overflow:hidden}
.report header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.report header b{font:700 17px var(--serif);color:var(--gold-hi);flex:1}
.report .cause{padding:16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.report .cause .oi{width:48px;height:48px;border-radius:12px;border:1px solid rgba(232,90,90,.5);color:var(--cross);display:grid;place-items:center;flex:none}
.report .cause .oi svg{width:28px;height:28px}
.report .cause b{display:block;font:700 19px var(--serif)}
.report .cause small{color:var(--muted)}
.report dl{margin:0;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.report dt{font:600 13px var(--cond);color:var(--gold)}
.report dd{margin:0}
.report .note{margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:rgba(61,134,255,.1);border:1px solid rgba(61,134,255,.3);font-size:14px}
.body-map{display:flex;justify-content:center;padding:6px 18px 10px 0;flex:none}
.body-map svg{width:70px;height:120px}
.body-map .z{fill:#1b2638;stroke:var(--gold-lo);stroke-width:1}
.body-map .z.hit{fill:var(--cross);stroke:#ffb3b3;filter:drop-shadow(0 0 4px var(--cross))}

.bill{position:fixed;left:50%;top:max(24px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(380px,92vw);border-radius:16px;background:linear-gradient(180deg,rgba(13,26,46,.97),rgba(8,17,31,.97));box-shadow:0 0 0 1px var(--gold-lo),0 0 0 2px #000,0 16px 40px -8px rgba(0,0,0,.7);z-index:7;padding:16px}
.bill .top{display:flex;gap:12px;align-items:center}
.bill .top img{width:40px;height:40px;border-radius:50%}
.bill .top b{display:block;font:700 16px var(--serif);color:var(--gold-hi)}
.bill .top small{color:var(--muted)}
.bill .amt{font:700 30px var(--serif);margin:12px 0 2px}
.bill p{margin:0;color:var(--muted);font-size:14px}
.bill .acts{display:flex;gap:16px;margin-top:12px;font-weight:600}
.bill .timer{height:3px;background:#1b2638;border-radius:3px;margin-top:12px;overflow:hidden}.bill .timer i{display:block;height:100%;background:var(--gold);width:100%}

.garage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:8;padding:20px}
.garage.on{display:flex}
.gbox{width:min(440px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:20px;background:linear-gradient(180deg,var(--panel),var(--navy));box-shadow:0 0 0 1px var(--gold-lo),0 0 0 2px #000,0 20px 60px -10px rgba(61,134,255,.5)}
.gbox header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.gbox header h2{margin:0;font:700 20px var(--serif);color:var(--gold-hi)}
.gbox header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.glist{list-style:none;margin:0;padding:10px;overflow-y:auto}
.glist button{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:none;border:1px solid transparent;cursor:pointer;text-align:left}
.glist button:hover:not(:disabled){border-color:var(--line);background:rgba(216,180,106,.06)}
.glist button:disabled{opacity:.4;cursor:not-allowed}
.glist .vic{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--gold-lo);display:grid;place-items:center;color:var(--gold)}
.glist b{display:block;font-weight:600}.glist small{color:var(--muted);font:500 13px var(--cond)}
.glist .go{margin-left:auto;font:700 13px var(--serif);color:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--panel);border:1px solid var(--gold);padding:10px 18px;border-radius:10px;font-weight:600;transition:.3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 10px}
.split2 small{display:block;color:var(--muted);font:500 12px var(--cond)}
.split2 b{display:block;font:700 22px var(--serif);margin:2px 0}
.split2 b.in{color:var(--ok)}
.bill .split{display:flex;height:6px;border-radius:6px;overflow:hidden;background:#1b2638}
.bill .split i{background:linear-gradient(90deg,var(--gold-lo),var(--gold))}.bill .split em{background:rgba(61,134,255,.55)}
.key .part{display:block;margin-top:8px;font:600 13px var(--cond);color:var(--ok)}

/* Écran de coma */
.coma{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,rgba(60,0,0,0) 35%,rgba(70,0,8,.55) 75%,rgba(20,0,0,.85));animation:comaPulse 3.2s ease-in-out infinite}
@keyframes comaPulse{50%{background-color:rgba(40,0,0,.12)}}
.coma .card{position:absolute;left:50%;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,92vw);text-align:center;padding:20px 22px;border-radius:18px;background:linear-gradient(180deg,rgba(13,26,46,.92),rgba(8,17,31,.95));box-shadow:0 0 0 1px rgba(232,90,90,.5),0 0 0 2px #000,0 20px 50px -10px rgba(0,0,0,.8)}
.coma h2{margin:0;font:700 24px var(--serif);color:#ffd9d9;letter-spacing:.04em}
.coma .ecg{height:28px;margin:6px auto 4px;width:220px}
.coma .ecg path{fill:none;stroke:var(--cross);stroke-width:2;stroke-dasharray:300;animation:ecg 2.4s linear infinite}
@keyframes ecg{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.coma .cstatus{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;margin:4px 0 12px}
.coma .cstatus i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.coma .cstatus.coming i{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.coma .cstatus.calling i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.coma .cstatus.none i{background:var(--cross)}
.coma .timer{font:700 34px var(--serif);color:var(--gold-hi);letter-spacing:.04em}
.coma .tl{color:var(--muted);font:500 13px var(--cond);margin-bottom:12px}
.coma .acts{display:flex;flex-direction:column;gap:8px;text-align:left}
.coma .act{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.25)}
.coma .act.off{opacity:.45}
.coma .act .hold{margin-left:auto;width:90px;height:6px;border-radius:6px;background:#1b2638;overflow:hidden}
.coma .act .hold i{display:block;height:100%;width:0;background:var(--gold)}

/* Carte de service (accueil) */
.dutycard{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:14px;margin-top:14px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.dutycard.on{border-color:rgba(76,195,138,.45);background:linear-gradient(110deg,rgba(76,195,138,.12),transparent 70%)}
.dutycard .lamp{width:14px;height:14px;border-radius:50%;background:#3a4558;flex:none}
.dutycard.on .lamp{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.dutycard div{flex:1}
.dutycard b{display:block;font:700 17px var(--serif);color:var(--gold-hi)}
.dutycard p{margin:2px 0 0;color:var(--muted);font-size:14px}
.btn.off{background:none;color:var(--text);border-color:var(--gold-lo)}

/* Alertes d'urgence (en jeu) */
.alerts{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:calc(20px + env(safe-area-inset-top,0px));width:min(330px,92vw);display:flex;flex-direction:column;gap:10px;z-index:7}
.al{border-radius:14px;background:linear-gradient(180deg,rgba(13,26,46,.97),rgba(8,17,31,.97));box-shadow:0 0 0 1px rgba(232,90,90,.55),0 0 0 2px #000,0 12px 30px -8px rgba(0,0,0,.7);overflow:hidden}
.al.new{animation:alIn .35s ease-out}
html.preview .alerts{top:64px}
html.preview .bill{top:84px}
.al.mine{box-shadow:0 0 0 1px var(--blue),0 0 0 2px #000,0 12px 30px -8px rgba(61,134,255,.5)}
.al.wait{opacity:.7;transform:scale(.97);transform-origin:top right}
.al.out{animation:alOut .3s ease-in forwards}
@keyframes alIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes alOut{to{opacity:0;transform:translateX(30px)}}
.al .top{display:flex;gap:12px;align-items:center;padding:12px 14px}
.al .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--cross);border:1px solid rgba(232,90,90,.55);position:relative}
.al .ic::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:2px solid var(--cross);opacity:0;animation:pulse 1.6s infinite}
.al.mine .ic{color:var(--blue);border-color:var(--blue)}.al.mine .ic::after{border-color:var(--blue)}
@keyframes pulse{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.al .tx{flex:1;min-width:0}
.al .tx b{display:block;font:700 15px var(--serif);color:var(--gold-hi)}
.al .tx small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .dist{text-align:right;flex:none}
.al .dist b{display:block;font:700 18px var(--serif)}
.al .dist small{color:var(--muted);font:500 12px var(--cond)}
.al .keys2{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font:600 13px var(--cond);background:rgba(0,0,0,.25)}
.al .keys2 .st{margin-left:auto;color:var(--blue)}
.al .tbar{height:3px;background:#1b2638}.al .tbar i{display:block;height:100%;background:var(--cross);transform-origin:left}

/* Barre d'aperçu (hors jeu uniquement) */
.demo{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;gap:6px;z-index:10;flex-wrap:wrap;justify-content:center;padding:0 8px}
.demo button{background:rgba(8,17,31,.9);border:1px solid var(--gold-lo);color:var(--gold-hi);border-radius:20px;padding:5px 12px;font:600 13px var(--cond);cursor:pointer}
.demo button[aria-pressed="true"]{background:var(--gold);color:#1A1206}
html.preview .stage{padding-top:56px}

@media (max-width:900px){
  .stage{padding:8px;align-items:stretch}
  html.preview .stage{padding-top:48px}
  .tablet{aspect-ratio:auto;height:100%;padding:12px;border-radius:26px}
  .tablet::before{display:none}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .demo{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
  .demo button{flex:none}
  nav{order:2;border-right:0;border-top:1px solid var(--line)}
  .me,.duty,.menu .sep{display:none}
  .menu{display:flex;overflow-x:auto;padding:6px;gap:2px}
  .menu li{flex:none}
  .menu button{flex-direction:column;gap:2px;font-size:12px;padding:6px 10px}
  .menu button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--gold)}
  .head{padding:14px 16px 12px;flex-wrap:wrap}.head h1{font-size:21px}
  .body{padding:16px}
  .keys,.two,.fin,.fees{grid-template-columns:1fr}
  .hero{flex-wrap:wrap}.stats{margin-left:0}
  .alt{transform:translate(-50%,-50%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function mockData(){const days=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'],t=(new Date().getDay()+6)%7;
  const week=MOCK.week.map((a,i)=>({day:days[(t-6+i+7)%7],amount:a}));

    employees:MOCK.employees,onDuty:MOCK.employees.filter(e=>e.duty).length,
    perms:MOCK.perms[mockGrade]||{},permMatrix:mockGrade===6?JSON.parse(JSON.stringify(MOCK.perms)):null,
    finance:(mockGrade===6||(MOCK.perms[mockGrade]||{}).finance_view)?{balance:MOCK.balance,week,revenue:MOCK.week.reduce((a,b)=>a+b,0),bills:23,logs:MOCK.logs}:null,
    care:{revive:10,heal:5,inspect:4}}}
async function rpc(name,...args){
  if(IN_GAME)return nui('rpc',{name,args});
  const E=MOCK.employees;
  switch(name){
    case 'nearby':return MOCK.nearby;
    case 'duty':return true;
    case 'bill':return true;
    case 'recruit':{const p=MOCK.nearby.find(x=>x.id===args[0])||{name:'Joueur '+args[0]};E.push({id:'n'+args[0],name:p.name,grade:0,online:true,duty:false});MOCK.nearby=MOCK.nearby.filter(x=>x.id!==args[0]);return true}
    case 'set_grade':{const e=E.find(x=>x.id===args[0]);if(e)e.grade=args[1];return true}
    case 'fire':{MOCK.employees=E.filter(x=>x.id!==args[0]);return true}
    case 'deposit':MOCK.balance+=args[0];MOCK.logs.unshift({type:'deposit',label:'Dépôt',amount:args[0],author:'Lena Moreau',ago:'à l\'instant'});return true;
    case 'withdraw':if(args[0]>MOCK.balance)return false;MOCK.balance-=args[0];MOCK.logs.unshift({type:'withdraw',label:'Retrait',amount:-args[0],author:'Lena Moreau',ago:'à l\'instant'});return true;
    case 'tablet_data':return mockData();
    case 'set_perms':MOCK.perms=JSON.parse(JSON.stringify(args[0]));return true;
  }}

let ALERTS=[];
const ago=sec=>sec<60?`il y a ${sec} s`:`il y a ${Math.floor(sec/60)} min`;
const fmtDist=m=>m==null?'—':m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1).replace('.',',')} km`;
function renderAlerts(){
  const mine=ALERTS.find(a=>a.mine);

  const waiting=ALERTS.filter(a=>!a.mine).length;
  const max=Math.max(1,+(ALERTS[0]?.max)||3);
  $('#alerts').innerHTML=order.slice(0,max).map((a,i)=>{const K=a.keys||{accept:'G',ignore:'X'};const sec=Math.max(0,Math.floor((Date.now()-a.recv)/1000)+(a.age||0));

      :mine?'<span style="color:var(--muted)">Terminez votre intervention en cours</span>'
      :active?`<span><kbd>${esc(K.accept)}</kbd>Accepter</span><span><kbd>${esc(K.ignore)}</kbd>Ignorer</span>`:'<span style="color:var(--muted)">En attente</span>';
    return `<div class="al ${Date.now()-a.recv<400?'new':''} ${a.mine?'mine':''} ${!active&&!a.mine?'wait':''} ${a.leaving?'out':''}" data-id="${a.id}">
     <div class="top"><span class="ic">${svg(a.mine?I.car:I.heart)}</span><div class="tx"><b>${a.mine?'Intervention en cours':a.kind==='call'?'Appel aux secours':'Personne à terre'}</b>${a.kind==='call'&&a.message?`<small style="color:var(--text)">« ${esc(a.message)} »</small>`:''}<small>${esc(a.street||'Lieu inconnu')}</small><small>${a.mine?'Patient · ID '+a.victim:ago(sec)}${!a.mine&&i===0&&waiting>1?` · ${waiting} appels`:''}</small></div>
     <div class="dist"><b>${fmtDist(a.dist)}</b><small>${a.mine?(a.arrived?'arrivé':'restant'):'distance'}</small></div></div>
     <div class="keys2">${keys}</div></div>`}).join('');
  if(!ALERTS.length)$('#alerts').innerHTML='';
}
