<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Téléphone de service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="phone" class="phone hidden">
    <div class="frame">
      <div class="notch"></div>
      <div class="statusbar"><span id="clock">--:--</span><span id="sb-unit"></span><span class="sb-right"><i id="sb-duty" class="duty-dot"></i>5G</span></div>
      <div id="screen" class="screen"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="callbar" class="callbar hidden"></div>
      <div class="homebar" id="homebar" title="Accueil"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
