<!DOCTYPE html>
<html lang="fr">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;1,600;1,700;1,800;1,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <!-- ely-theme -->
    <meta charset="UTF-8">
    <title>Elyzea Fourrière</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="layer hidden">
        <div class="pound">
            <header class="head">
                <div class="crest" id="crest">🚧</div>
                <div class="titles">
                    <div class="eyebrow" id="kindLabel">Fourrière</div>
                    <h1 id="poundName">Fourrière</h1>
                    <div class="sub" id="sub">Tes véhicules enlevés ou détruits.</div>
                </div>
                <div class="wallet" id="wallet"></div>
                <button class="icon-btn" id="closeBtn" title="Fermer (Échap)">✕</button>
            </header>
            <div class="bar">
                <div class="tabs" id="tabs"></div>
                <div class="pay" id="pay"></div>
            </div>
            <div class="msg hidden" id="msg"></div>
            <main class="grid" id="grid"></main>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
