<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Elyzea Core</title>
<style>
  :root {
    --panel: rgba(13, 19, 34, 0.94);
    --line: #2a3754;
    --text: #ecf0f8;
    --muted: #8e9ab3;
    --gold: #d9b56a;
    --ok: #4fb3a9;
    --danger: #e0433b;
    --info: #3b6fe0;
    --warn: #e07a3f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Segoe UI', Roboto, Arial, sans-serif; color: var(--text); user-select: none; }

  #notify { position: absolute; top: 24px; right: 24px; width: 340px; display: flex; flex-direction: column; gap: 10px; }
  #notify.top-left { right: auto; left: 24px; }
  #notify.top { right: auto; left: 50%; transform: translateX(-50%); }
  .toast { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--info);
           border-radius: 8px; padding: 11px 14px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
           animation: in .25s ease-out; overflow: hidden; }
  .toast.success { border-left-color: var(--ok); }
  .toast.error { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warn); }
  .toast .title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; font-weight: 600; }
  .toast .msg { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .toast .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: currentColor; opacity: .35; width: 100%; transform-origin: left; }
  .toast.out { animation: out .25s ease-in forwards; }
  @keyframes in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateX(20px); } }

  #progress { position: absolute; left: 50%; bottom: 11%; transform: translateX(-50%); width: 340px; display: none; }
  #progress .label { text-align: center; font-size: 14px; margin-bottom: 8px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #progress .track { height: 8px; background: rgba(13,19,34,.85); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #progress .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #f1d899); }

  #textui { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); display: none;
            background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold);
            border-radius: 8px; padding: 10px 16px; font-size: 14px; max-width: 360px; }
  #textui kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 6px; text-align: center;
                border: 1px solid var(--gold); border-radius: 4px; color: var(--gold); font-weight: 700; font-family: inherit; }
</style>
</head>
<body>
<div id="notify"></div>
<div id="progress"><div class="label"></div><div class="track"><div class="fill"></div></div></div>
<div id="textui"></div>
<script>
  const notifyBox = document.getElementById('notify');
  const progress = document.getElementById('progress');
  const textui = document.getElementById('textui');
  let progressTimer = null;

  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  // ~g~ texte ~s~ : codes couleur GTA retirés pour un affichage propre
  function clean(s) { return String(s == null ? '' : s).replace(/~[a-zA-Z]~/g, ''); }

  function notify(d) {
    if (d.position) notifyBox.className = d.position;
    const t = document.createElement('div');
    const kind = ['success', 'error', 'warning'].includes(d.type) ? d.type : 'inform';
    t.className = 'toast ' + kind;
    t.innerHTML = (d.title ? `<div class="title">${esc(clean(d.title))}</div>` : '') + `<div class="msg">${esc(clean(d.text))}</div><div class="bar"></div>`;
    notifyBox.appendChild(t);
    const dur = Math.max(1000, d.duration || 5000);
    const bar = t.querySelector('.bar');
    bar.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: dur, easing: 'linear' });
    while (notifyBox.children.length > 6) notifyBox.firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, dur);
  }

  function startProgress(d) {
    progress.querySelector('.label').textContent = clean(d.label || '');
    const fill = progress.querySelector('.fill');
    fill.style.transition = 'none';
    fill.style.width = '0%';
    progress.style.display = 'block';
    void fill.offsetWidth;
    fill.style.transition = `width ${d.duration}ms linear`;
    fill.style.width = '100%';
    clearTimeout(progressTimer);
    progressTimer = setTimeout(() => { progress.style.display = 'none'; }, d.duration + 50);
  }

  function stopProgress() { clearTimeout(progressTimer); progress.style.display = 'none'; }

  function showText(d) {
    let html = esc(clean(d.text || ''));
    html = html.replace(/\[([A-Z0-9]{1,6})\]/g, '<kbd>$1</kbd>');
    textui.innerHTML = html;
    textui.style.display = 'block';
  }

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    switch (d.action) {
      case 'notify': return notify(d);
      case 'progress': return startProgress(d);
      case 'progressStop': return stopProgress();
      case 'textui': return showText(d);
      case 'textuiHide': textui.style.display = 'none'; return;
    }
  });
</script>
</body>
</html>
