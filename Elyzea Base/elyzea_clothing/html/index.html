<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elyzea · Boutique de vêtements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="silhouette" viewBox="0 0 120 300" aria-hidden="true"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a4258"/><stop offset="1" stop-color="#1a1f2c"/></linearGradient></defs>
  <circle cx="60" cy="28" r="18" fill="url(#sg)"/><path d="M34 52h52l10 70-8 4-6-44-2 58H40l-2-58-6 44-8-4z" fill="url(#sg)"/><path d="M40 166h40l-4 118h-12l-4-96-4 96H44z" fill="url(#sg)"/></svg>

<!-- Boutique -->
<div id="app" class="hidden">
  <div id="stage" aria-label="Glisser pour tourner le personnage"></div>

  <section class="shop" aria-label="Boutique">
    <div class="screen">
      <div class="top"><img src="logo.png" alt=""><div><h1 id="shopName">Boutique</h1><p>Boutique de vêtements</p></div><button class="x" id="close" aria-label="Quitter la boutique">✕</button></div>
      <div class="main">
        <nav class="rail" id="rail" aria-label="Rayons"></nav>
        <div class="content">
          <div class="chead"><div><h2 id="catTitle"></h2><small id="catSub"></small></div>
            <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="search" inputmode="numeric" placeholder="N° du modèle" aria-label="Chercher un numéro de modèle"></div></div>
          <div class="filters" id="filters"></div>
          <div class="grid" id="grid"></div>
          <div class="detail" id="detail"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="cart" aria-label="Panier">
    <div class="screen">
      <div class="ctop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><h2>Panier</h2><span class="n" id="cartN">0</span></div>
      <div class="citems" id="cartItems"></div>
      <div class="cfoot" id="cartFoot"></div>
    </div>
  </section>

  <div class="hint">Survole un modèle : il apparaît sur toi · Flèches pour défiler · Entrée pour l'ajouter · A / E pour pivoter</div>
  <div class="tools" id="tools"></div>
  <div id="modal"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- Ma tenue -->
<section id="wardrobe" class="hidden" aria-label="Ma tenue">
  <div class="screen">
    <div class="ctop"><svg viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 5 4-3 4-2-1v11H8V10l-2 1-3-4z"/></svg><h2>Ma tenue</h2><button class="mini" id="wClose" aria-label="Fermer">✕</button></div>
    <div class="wlist" id="wList"></div>
    <div class="wfoot" id="wFoot"></div>
  </div>
</section>

<!-- Renommer -->
<div id="rename" class="hidden"><div class="mbox" role="dialog" aria-labelledby="rnT">
  <h3 id="rnT">Renommer le vêtement</h3><p>Le nouveau nom s'affiche dans l'inventaire. Laisse vide pour remettre le nom d'origine.</p>
  <input id="rnInput" maxlength="32" placeholder="ex : Veste de mariage" autocomplete="off"><span class="count" id="rnCount">0 / 32</span>
  <div class="row"><button class="btn ghost" id="rnCancel">Annuler</button><button class="btn primary" id="rnOk">Valider</button></div>
</div></div>

<script src="app.js"></script>
</body>
</html>
