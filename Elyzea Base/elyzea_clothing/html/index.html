<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elyzea · Boutique de vêtements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   BOUTIQUE DE VÊTEMENTS ELYZEA
   Même charte que le menu staff : bleu nuit, or, liseré bleu/or/rouge.
   ========================================================= */
:root{
  --bezel:#0a0d16;--asphalt:#0d1322;--panel:#151d30;--panel-2:#1c2640;--line:#2a3754;--line-soft:rgba(42,55,84,.6);
  --text:#ecf0f8;--muted:#8e9ab3;--signal:#d9b56a;--gold-hi:#f1d899;--gold-lo:#9c7a3c;
  --danger:#e0433b;--ok:#4fb3a9;--info:#3b6fe0;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow','Segoe UI',Arial,sans-serif;--brand:'Cinzel','Trajan Pro',Georgia,serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font:400 14px/1.45 var(--body);color:var(--text);user-select:none;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#3a4a6c}

/* Aperçu hors jeu : un studio et une silhouette à la place du personnage */
html.preview body{background:radial-gradient(ellipse at 62% 45%,#2a2f3d 0%,#141824 45%,#07090f 100%)}
#silhouette{display:none}
html.preview #silhouette{display:block;position:fixed;left:50%;top:50%;transform:translate(-8%,-48%);height:82vh;opacity:.9;pointer-events:none}

#app{position:fixed;inset:0}
#app.closing{animation:fadeOut .25s forwards}
@keyframes fadeOut{to{opacity:0}}

/* Zone centrale : glisser pour tourner le personnage */
#stage{position:absolute;inset:0;cursor:grab}
#stage.drag{cursor:grabbing}

/* ---------- Panneau boutique (gauche) ---------- */
.shop{position:absolute;left:24px;top:24px;bottom:24px;width:min(600px,46vw);display:flex;flex-direction:column;
  border-radius:22px;padding:10px;background:linear-gradient(160deg,#1d2333 0%,var(--bezel) 55%,#141826 100%);
  border:1px solid rgba(217,181,106,.35);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  animation:slideL .28s ease-out}
@keyframes slideL{from{opacity:0;transform:translateX(-24px)}}
.screen{flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--asphalt);display:flex;flex-direction:column}
.top{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0a0f1b}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--info),var(--signal) 50%,var(--danger))}
.top img{width:42px;height:42px;filter:drop-shadow(0 4px 12px rgba(217,181,106,.3))}
.top h1{font:700 19px/1.1 var(--brand);letter-spacing:.04em;color:var(--gold-hi)}
.top p{font:500 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.top .x{margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);font-size:16px}
.top .x:hover{color:var(--danger);border-color:rgba(224,67,59,.5)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:96px 1fr}
.rail{background:linear-gradient(180deg,#0f1626,#0b101c);border-right:1px solid var(--line);overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:3px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border:0;border-radius:10px;background:none;color:var(--muted);
  font:600 11px/1.15 var(--display);letter-spacing:.03em;text-transform:uppercase;text-align:center;position:relative;border-left:3px solid transparent}
.rail button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{color:var(--text);background:rgba(255,255,255,.03)}
.rail button.on{color:var(--gold-hi);background:var(--panel);border-left-color:var(--signal)}
.rail button .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--signal)}

.content{display:flex;flex-direction:column;min-height:0;min-width:0}
.chead{display:flex;align-items:flex-end;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.chead h2{font:700 26px/1 var(--display);letter-spacing:.01em}
.chead small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.search{margin-left:auto;position:relative;width:150px}
.search input{width:100%;height:34px;padding:0 10px 0 30px;border-radius:8px;border:1px solid var(--line);background:#0a0f1b;outline:none;font-size:13px;user-select:text}
.search input:focus{border-color:var(--signal)}
.search svg{position:absolute;left:9px;top:9px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}

.grid{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));grid-auto-rows:146px;gap:10px;align-content:start}
.card{position:relative;height:146px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#111829);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;overflow:hidden;transition:border-color .12s,transform .12s}
.card:hover{border-color:rgba(217,181,106,.6);transform:translateY(-1px)}
.card.pv:not(.sel){border-color:rgba(59,111,224,.9);box-shadow:0 0 0 1px rgba(59,111,224,.6),0 0 20px -6px rgba(59,111,224,.8)}
.card .foot .live{display:none;color:#9dc1ff;font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase}
.card.pv .foot .live,.card.sel .foot .live{display:inline}
.card.sel .foot .live{color:var(--gold-hi)}
.badge-live{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#9dc1ff;margin-left:8px}
.badge-live::before{content:"";width:7px;height:7px;border-radius:50%;background:#5f95ff;box-shadow:0 0 8px #5f95ff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.card.sel{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal),0 0 22px -6px rgba(217,181,106,.7)}
.card .img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px 10px 34px}
/* Images réelles : un emplacement invisible attend le chargement, l'icône reste visible tant qu'il n'y a pas d'image */
.pending{visibility:hidden;pointer-events:none}
.fade{animation:imgIn .2s ease}
@keyframes imgIn{from{opacity:0;transform:scale(.97)}}
.card .img.tfb{opacity:.92}
.card .ico{width:46%;height:46%;stroke:var(--signal);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.85;margin-top:-10px}
.card.hasimg .ico{display:none}
.card .num{position:absolute;left:8px;top:7px;font:700 13px var(--display);color:var(--muted);letter-spacing:.03em}
.card .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:6px 9px;background:rgba(10,15,27,.85);border-top:1px solid var(--line-soft);font-size:12px}
.card .foot b{font:700 14px var(--display);color:var(--gold-hi)}
.card .foot span{color:var(--muted)}
.card .tag{position:absolute;right:7px;top:7px;font:700 10px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px}
.card .tag.worn{color:var(--ok);background:rgba(79,179,169,.12);border:1px solid rgba(79,179,169,.35)}
.card .tag.incart{color:#1a1406;background:var(--signal)}
.card.none .ico{opacity:.45}
.more{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-size:12px;padding:6px}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:30px 10px}

/* Détail de l'article choisi */
.detail{border-top:1px solid var(--line);padding:12px 16px 14px;background:linear-gradient(180deg,#0f1626,#0b101c)}
.drow{display:flex;align-items:center;gap:14px}
.dname{flex:1;min-width:0}
.dname b{display:block;font:700 20px/1.1 var(--display)}
.dname span{color:var(--muted);font-size:12.5px}
.price{font:700 26px/1 var(--display);color:var(--gold-hi);white-space:nowrap}
.price.free{color:var(--ok);font-size:20px}
.tex{display:flex;align-items:center;gap:8px;margin:11px 0 12px}
.tex label{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sw{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px}
.sw button{min-width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font:600 13px var(--display);color:var(--muted);flex:none}
.sw button:hover{border-color:var(--signal);color:var(--text)}
.sw button.on{background:linear-gradient(180deg,var(--gold-hi),var(--signal));color:#1a1406;border-color:var(--signal)}
.sw button{position:relative;overflow:hidden}
.sw button .thumb{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:contain;border-radius:6px;background:#0a0f1b}
.sw button.hasimg{min-width:46px;height:46px}
.sw button.hasimg .n{position:absolute;right:3px;bottom:2px;z-index:1;font-size:10px;line-height:1;padding:1px 3px;border-radius:4px;background:rgba(10,15,27,.85);color:var(--text)}
.sw button.hasimg.on .n{background:var(--signal);color:#1a1406}
.arrow{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);flex:none;color:var(--text)}
.arrow:hover{border-color:var(--signal)}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--panel-2);padding:11px 16px;font:600 14px var(--body);transition:filter .12s,border-color .12s}
.btn:hover{border-color:var(--signal)}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--signal));color:#1a1406;border-color:var(--signal);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.wide{width:100%}
.btn.ghost{background:none}

/* ---------- Panier (droite) ---------- */
.cart{position:absolute;right:24px;top:24px;width:min(340px,26vw);max-height:calc(100% - 150px);display:flex;flex-direction:column;
  border-radius:20px;padding:8px;background:linear-gradient(160deg,#1d2333 0%,var(--bezel) 55%,#141826 100%);
  border:1px solid rgba(217,181,106,.35);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.6);animation:slideR .28s ease-out}
@keyframes slideR{from{opacity:0;transform:translateX(24px)}}
.cart .screen{border-radius:13px}
.ctop{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#0a0f1b;position:relative}
.ctop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--info),var(--signal) 50%,var(--danger))}
.ctop svg{width:22px;height:22px;stroke:var(--signal);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ctop h2{font:700 19px var(--display);letter-spacing:.02em;flex:1}
.ctop .n{font:700 12px var(--display);background:var(--signal);color:#1a1406;border-radius:10px;padding:1px 8px}
.citems{flex:1;min-height:60px;overflow-y:auto;padding:8px}
.ci{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent}
.ci:hover{background:rgba(255,255,255,.03);border-color:var(--line-soft)}
.ci .th{width:44px;height:44px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.ci .th svg{width:26px;height:26px;stroke:var(--signal);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ci .th .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:3px;background:var(--panel)}
.ci .th.hasimg svg{visibility:hidden}
.ci .tx{flex:1;min-width:0;cursor:pointer}
.ci .tx b{display:block;font:600 14px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .tx span{color:var(--muted);font-size:12px}
.ci .p{font:700 15px var(--display);color:var(--gold-hi);white-space:nowrap}
.ci .rm{width:26px;height:26px;border-radius:7px;border:0;background:none;color:var(--muted);font-size:14px}
.ci .rm:hover{color:var(--danger);background:rgba(224,67,59,.1)}
.cempty{color:var(--muted);text-align:center;padding:22px 12px;font-size:13px;line-height:1.5}
.cfoot{border-top:1px solid var(--line);padding:12px 14px 14px;background:linear-gradient(180deg,#0f1626,#0b101c)}
.total{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.total span{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.total b{font:700 30px/1 var(--display);color:var(--gold-hi)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.pay button{border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:8px 10px;text-align:left}
.pay button small{display:block;font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pay button b{font:700 15px var(--display)}
.pay button.on{border-color:var(--signal);background:rgba(217,181,106,.1)}
.pay button.on b{color:var(--gold-hi)}
.pay button.short b{color:var(--danger)}
.warn{color:#ffb0aa;font-size:12px;margin:-4px 0 8px}

.wear{display:flex;align-items:center;gap:9px;margin:-2px 0 10px;font-size:13px;color:var(--text);cursor:pointer}
.wear input{appearance:none;width:36px;height:20px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer}
.wear input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.15s}
.wear input:checked{background:rgba(217,181,106,.35);border-color:var(--signal)}
.wear input:checked::after{left:18px;background:var(--gold-hi)}
.wear small{display:block;color:var(--muted);font-size:11.5px}
.inv-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);margin:-2px 0 10px;line-height:1.4}
.inv-note b{color:var(--text);font-weight:600}

/* ---------- Ma tenue (hors boutique) ---------- */
#wardrobe{position:fixed;right:24px;top:50%;transform:translateY(-50%);width:min(420px,92vw);max-height:86vh;display:flex;flex-direction:column;
  border-radius:20px;padding:8px;background:linear-gradient(160deg,#1d2333 0%,var(--bezel) 55%,#141826 100%);
  border:1px solid rgba(217,181,106,.35);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.6);z-index:20;animation:slideR .25s ease-out}
#wardrobe .screen{border-radius:13px}
.wlist{overflow-y:auto;padding:8px}
.wi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent}
.wi:hover{background:rgba(255,255,255,.03);border-color:var(--line-soft)}
.wi .th{width:40px;height:40px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.wi .th svg{width:24px;height:24px;stroke:var(--signal);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.wi.naked .th svg{stroke:var(--muted);opacity:.6}
.wi .tx{flex:1;min-width:0}
.wi .tx b{display:block;font:600 14px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .tx span{color:var(--muted);font-size:12px}
.wi.naked .tx b{color:var(--muted);font-weight:500}
.mini{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font:600 12px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.mini:hover{border-color:var(--signal)}
.mini.gold{color:var(--gold-hi)}
.mini:disabled{opacity:.35;cursor:not-allowed}
.wfoot{padding:10px 14px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.45;background:linear-gradient(180deg,#0f1626,#0b101c)}

/* ---------- Renommer ---------- */
#rename{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,8,14,.55);z-index:30}
#rename .mbox input{width:100%;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#0a0f1b;outline:none;font:600 16px var(--body);user-select:text;margin-bottom:6px}
#rename .mbox input:focus{border-color:var(--signal)}
#rename .count{display:block;text-align:right;color:var(--muted);font-size:11.5px;margin-bottom:14px}

/* ---------- Caméra (bas, au centre) ---------- */
.tools{position:absolute;bottom:26px;left:calc(24px + min(600px,46vw) + (100vw - 48px - min(600px,46vw) - min(340px,26vw)) / 2);transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;padding:7px;border-radius:16px;background:rgba(10,13,22,.88);border:1px solid rgba(217,181,106,.3);box-shadow:0 14px 40px rgba(0,0,0,.55)}
.tools button{height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);font:600 13px var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.tools button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools button:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tools button.on{color:var(--gold-hi);background:var(--panel);border-color:rgba(217,181,106,.4)}
.tools .sep{width:1px;height:24px;background:var(--line);margin:0 3px}
.hint{position:absolute;bottom:84px;left:calc(24px + min(600px,46vw) + (100vw - 48px - min(600px,46vw) - min(340px,26vw)) / 2);transform:translateX(-50%);
  color:rgba(236,240,248,.6);font:500 12px var(--body);letter-spacing:.05em;text-shadow:0 1px 4px #000;white-space:nowrap}

/* ---------- Messages ---------- */
.toast{position:fixed;left:50%;top:26px;transform:translate(-50%,-10px);opacity:0;padding:11px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;
  box-shadow:0 14px 40px rgba(0,0,0,.6);transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(224,67,59,.6);color:#ffc4be}
.toast.ok{border-color:rgba(79,179,169,.6);color:#bdeee7}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,14,.55);z-index:10}
.mbox{width:min(420px,90vw);border-radius:18px;background:var(--panel);border:1px solid rgba(217,181,106,.35);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.mbox h3{font:700 22px var(--display);margin-bottom:6px}
.mbox p{color:var(--muted);margin-bottom:16px}
.mbox .row{display:flex;gap:8px;justify-content:flex-end}
.done{position:absolute;inset:0;display:grid;place-items:center;z-index:11;background:rgba(5,8,14,.45);animation:fade .2s}
.done div{text-align:center;padding:26px 34px;border-radius:20px;background:linear-gradient(180deg,#1c2640,#111829);border:1px solid var(--signal);box-shadow:0 0 50px -10px rgba(217,181,106,.6)}
.done svg{width:56px;height:56px;stroke:var(--ok);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done b{display:block;font:700 26px var(--display);margin-top:8px}
.done span{color:var(--muted)}
@keyframes fade{from{opacity:0}}

/* Écrans plus petits : la barre caméra passe sous le panier, en icônes */
@media (max-width:1500px){
  .tools{left:auto;right:24px;transform:none;width:min(340px,26vw);flex-wrap:wrap;justify-content:center;gap:4px}
  .tools button{padding:0 6px;min-width:33px;height:36px}
  .tools button span{display:none}
  .tools .sep{display:none}
  .hint{display:none}
  .cart{max-height:calc(100% - 140px)}
}
@media (max-width:1100px){
  .shop{width:56vw}.cart,.tools{width:36vw}
}
@media (max-width:760px){
  .shop{left:8px;right:8px;top:8px;bottom:auto;height:58vh;width:auto}
  .cart{left:8px;right:8px;top:auto;bottom:70px;width:auto;max-height:30vh}
  .tools{bottom:10px;left:50%;flex-wrap:nowrap;overflow-x:auto;max-width:96vw}
  .tools button span{display:none}
  .main{grid-template-columns:76px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 <circle cx="60" cy="28" r="18" fill="url(#sg)"/><path d="M34 52h52l10 70-8 4-6-44-2 58H40l-2-58-6 44-8-4z" fill="url(#sg)"/><path d="M40 166h40l-4 118h-12l-4-96-4 96H44z" fill="url(#sg)"/></svg>

  <input id="rnInput" maxlength="32" placeholder="ex : Veste de mariage" autocomplete="off"><span class="count" id="rnCount">0 / 32</span>
  <div class="row"><button class="btn ghost" id="rnCancel">Annuler</button><button class="btn primary" id="rnOk">Valider</button></div>
</div></div>

<script>
const IN_GAME = typeof GetParentResourceName === 'function';
const RES = IN_GAME ? GetParentResourceName() : 'elyzea_clothing';
if (!IN_GAME) document.documentElement.classList.add('preview');
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const post = (ev, data = {}) => IN_GAME
  ? fetch(`https://${RES}/${ev}`, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(data) }).then((r) => r.json()).catch(() => ({}))
  : Promise.resolve(mock(ev, data));

/* ---------- Icônes ---------- */
const P = {
  top: '<path d="M8 3l4 2 4-2 5 4-3 4-2-1v11H8V10l-2 1-3-4z"/>',
  tshirt: '<path d="M8 4h8l5 3-2.5 4L16 10v10H8V10l-2.5 1L3 7z"/><path d="M10 4a2 2 0 0 0 4 0"/>',
  pants: '<path d="M7 3h10l1 18h-4l-2-11-2 11H6z"/><path d="M7 7h10"/>',
  shoe: '<path d="M3 15c0-3 1-6 2-8h4l1 3c2 1 6 2 9 3 1.5.5 2 1.5 2 3v1H3z"/><path d="M3 18h19"/>',
  bag: '<rect x="5" y="7" width="14" height="13" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2M9 12h6"/>',
  vest: '<path d="M8 3h2l2 3 2-3h2l3 4v13H5V7z"/><path d="M12 6v14M8.5 11h1M14.5 11h1"/>',
  glove: '<path d="M7 21v-6l-2-4V7a1.5 1.5 0 0 1 3 0v3V5a1.5 1.5 0 0 1 3 0v5V4a1.5 1.5 0 0 1 3 0v6V6a1.5 1.5 0 0 1 3 0v8l-2 7z"/>',
  chain: '<path d="M7 3c0 6 2 10 5 12 3-2 5-6 5-12"/><circle cx="12" cy="18" r="3"/>',
  mask: '<path d="M4 6c5-2 11-2 16 0v6c0 5-4 8-8 8s-8-3-8-8z"/><path d="M7 10.5c1-1 3-1 4 0M13 10.5c1-1 3-1 4 0M9 16c2 1 4 1 6 0"/>',
  decal: '<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>',
  hat: '<path d="M4 16c2-1 14-1 16 0M6 16V12a6 6 0 0 1 12 0v4"/><path d="M2 17c4 2 16 2 20 0"/>',
  glasses: '<circle cx="7" cy="14" r="4"/><circle cx="17" cy="14" r="4"/><path d="M11 13.5c.7-.6 1.3-.6 2 0M3 13l-1-4M21 13l1-4"/>',
  earring: '<path d="M9 3a5 5 0 0 1 6 6c-1 3-4 3-4 6"/><circle cx="11" cy="18" r="3"/>',
  watch: '<rect x="7" y="7" width="10" height="10" rx="3"/><path d="M9 7l1-4h4l1 4M9 17l1 4h4l1-4M12 10v2l1.5 1"/>',
  bracelet: '<ellipse cx="12" cy="12" rx="8" ry="4.5"/><path d="M4 12c0 2.5 3.6 4.5 8 4.5s8-2 8-4.5"/><circle cx="12" cy="7.6" r="1.2"/>',
  none: '<circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/>',
};
const svg = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[k] || P.top}</svg>`;
const ICON = {
  full: '<path d="M12 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM8 10h8l-1 5h-1l-1 6h-2l-1-6H9z"/>',
  head: '<circle cx="12" cy="9" r="5"/><path d="M5 21c1-4 4-6 7-6s6 2 7 6"/>',
  torso: '<path d="M8 3l4 2 4-2 5 4-3 4-2-1v11H8V10l-2 1-3-4z"/>',
  legs: '<path d="M7 3h10l1 18h-4l-2-11-2 11H6z"/>',
  feet: '<path d="M3 15c0-3 1-6 2-8h4l1 3c2 1 6 2 9 3 1.5.5 2 1.5 2 3v1H3z"/>',
  left: '<path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/>',
  right: '<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/>',
  hands: '<path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10V4.5a1.5 1.5 0 0 1 3 0V10V5.5a1.5 1.5 0 0 1 3 0V13l-2 8H9l-4-6.5a1.6 1.6 0 0 1 2.6-1.8L9 14"/>',
};
const ico = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- État ---------- */
let S = null;                 // données de la boutique
let cat = null;               // catégorie affichée
let sel = null;               // { d, t, n } article sélectionné
const cart = new Map();       // id catégorie -> article
let wearNow = false;
let method = 'cash', shown = 60, query = '', camView = 'full', hands = false, busy = false;
const money = (n) => `${Math.round(n || 0).toLocaleString('fr-FR')} ${S ? S.currency : '$'}`;
const catById = (id) => S.categories.find((c) => c.id === id);
const PAY = { cash: 'Liquide', bank: 'Banque' };
const CAM_OF = { torso: 'torso', head: 'head', legs: 'legs', feet: 'feet', back: 'back', hand: 'hand', full: 'full' };

/* ---------- Images réelles des vêtements ----------
   Chemin : base + pattern, par défaut  images/{sex}/{cat}/{d}_{t}.{ext}  ex. images/male/tops/12_0.webp
   Ordre d'essai : coloris demandé (ext puis fallbackExt), puis coloris 0 du même modèle
   (si textureFallback), puis l'icône générique. Chaque adresse n'est testée qu'une fois (cache). */
const IMG = (() => {
  const seen = new Map();   // url -> true | false | Promise
  let cfg = null;
  function setup(im) {
    cfg = null;
    if (!im || !im.enabled) return;
    let base = String(im.base == null || im.base === '' ? 'images/' : im.base);
    if (!base.endsWith('/')) base += '/';
    const extra = Array.isArray(im.fallbackExt) ? im.fallbackExt : (im.fallbackExt ? [im.fallbackExt] : []);
    const exts = [im.ext || 'webp', ...extra].filter((e, i, a) => e && a.indexOf(e) === i);
    cfg = { base, exts, pattern: im.pattern || '{sex}/{cat}/{d}_{t}.{ext}', textureFallback: im.textureFallback !== false };
  }
  function build(c, d, t, ext) {
    const v = { sex: S.sex, gender: S.sex === 'male' ? 'm' : 'f', cat: c.id, type: c.type, index: c.index, d, t, ext };
    return cfg.base + cfg.pattern.replace(/\{(\w+)\}/g, (m, k) => (v[k] ?? m));
  }
  // strict = seulement ce coloris (pastilles de coloris), sinon repli sur le coloris 0
  function candidates(c, d, t, strict) {
    if (!cfg || !c || d < 0) return [];
    const out = cfg.exts.map((e) => ({ url: build(c, d, t, e), tfb: false }));
    if (!strict && cfg.textureFallback && t > 0) cfg.exts.forEach((e) => out.push({ url: build(c, d, 0, e), tfb: true }));
    return out;
  }
  function probe(url) {
    const st = seen.get(url);
    if (st === true || st === false) return Promise.resolve(st);
    if (st) return st;
    const p = new Promise((res) => {
      const im = new Image();
      im.onload = () => { seen.set(url, true); res(true); };
      im.onerror = () => { seen.set(url, false); res(false); };
      im.src = url;
    });
    seen.set(url, p);
    return p;
  }
  // Déjà connu : rendu immédiat sans clignotement. undefined = encore inconnu, null = aucune image.
  function known(c, d, t, strict) {
    for (const cand of candidates(c, d, t, strict)) {
      const st = seen.get(cand.url);
      if (st === true) return cand;
      if (st !== false) return undefined;
    }
    return null;
  }
  async function resolve(c, d, t, strict) {
    for (const cand of candidates(c, d, t, strict)) if (await probe(cand.url)) return cand;
    return null;
  }
  return { setup, known, resolve, on: () => !!cfg };
})();

// Balise d'image d'un vêtement : <img> si l'image est connue, emplacement en attente sinon, rien si absente.
function photo(c, d, t, cls = 'img', strict = false) {
  if (!IMG.on() || !c || d < 0) return '';
  const k = IMG.known(c, d, t, strict);
  if (k === null) return '';
  if (k) return `<img class="${cls}${k.tfb ? ' tfb' : ''}" src="${esc(k.url)}" alt="" draggable="false">`;
  return `<i class="${cls} pending" data-ph="${c.id}|${d}|${t}|${strict ? 1 : 0}"></i>`;
}
// Marque les conteneurs qui ont une image (cache l'icône générique) et charge les emplacements visibles
let imgIO = null;
function hydrate(root) {
  if (!root) return;
  root.querySelectorAll('img.img, img.thumb').forEach((im) => im.parentNode.classList.add('hasimg'));
  const phs = root.querySelectorAll('[data-ph]');
  if (!phs.length) return;
  if (!imgIO) {
    imgIO = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { imgIO.unobserve(e.target); loadPh(e.target); }
    }), { rootMargin: '300px' });
  }
  phs.forEach((p) => imgIO.observe(p));
}
async function loadPh(ph) {
  const [id, d, t, strict] = ph.dataset.ph.split('|');
  const k = await IMG.resolve(catById(id), Number(d), Number(t), strict === '1');
  if (!ph.isConnected) return;
  if (!k) { ph.remove(); return; }                       // pas d'image : l'icône générique reste
  const im = new Image();
  im.className = `${ph.className.replace('pending', '').trim()} fade${k.tfb ? ' tfb' : ''}`;
  im.alt = ''; im.draggable = false; im.src = k.url;
  const parent = ph.parentNode;
  ph.replaceWith(im);
  parent.classList.add('hasimg');
}
// Change l'image d'une carte sans reconstruire la grille (survol d'un coloris)
function cardTexture(d, t) {
  const card = document.querySelector(`.card[data-d="${d}"]`);
  if (!card || !IMG.on()) return;
  card.querySelectorAll('.img').forEach((n) => n.remove());
  card.classList.remove('hasimg');
  card.insertAdjacentHTML('afterbegin', photo(cat, d, t));
  hydrate(card);
}
function list(c) {
  const black = new Set(c.blacklist || []);
  const out = [];
  if (c.type === 'prop') out.push(-1);
  for (let i = 0; i < c.count; i++) if (!black.has(i)) out.push(i);
  return query ? out.filter((d) => String(d).includes(query)) : out;
}
const priceOf = (c, d) => (d < 0 ? 0 : c.price);
const SINGULAR = { tops: 'Haut', undershirts: 'T-shirt', pants: 'Pantalon', shoes: 'Chaussures', bags: 'Sac', vests: 'Gilet', arms: 'Gants',
  chains: 'Collier', masks: 'Masque', decals: 'Logo', hats: 'Chapeau', glasses: 'Lunettes', ears: 'Boucles d\'oreilles', watches: 'Montre', bracelets: 'Bracelet' };
const one = (c) => SINGULAR[c.id] || c.label;
const label = (c, d) => (d < 0 ? `Retirer : ${c.label.toLowerCase()}` : `${one(c)} n°${d}`);

/* ---------- Rendu ---------- */
function renderRail() {
  $('#rail').innerHTML = S.categories.map((c) => `<button class="${cat && c.id === cat.id ? 'on' : ''}" data-cat="${c.id}" title="${esc(c.label)}">
    ${svg(c.icon)}<span>${esc(c.label)}</span>${cart.has(c.id) ? '<i class="dot"></i>' : ''}</button>`).join('');
}
function renderGrid(keepScroll) {
  const g = $('#grid'), top = g.scrollTop;
  const all = list(cat);
  $('#catTitle').textContent = cat.label;
  $('#catSub').textContent = `${cat.count} modèle${cat.count > 1 ? 's' : ''} · ${money(cat.price)} l'article`;
  const inCart = cart.get(cat.id);
  g.innerHTML = all.slice(0, shown).map((d) => {
    const worn = d === cat.current.drawable, isSel = sel && sel.d === d, isCart = inCart && inCart.drawable === d;
    // Coloris affiché sur la carte : sélection > panier > porté > coloris 0
    const t = isSel ? sel.t : isCart ? inCart.texture : worn ? cat.current.texture : 0;
    return `<button class="card ${isSel ? 'sel' : ''} ${d < 0 ? 'none' : ''}" data-d="${d}" aria-label="${esc(label(cat, d))}">
      ${photo(cat, d, t)}
      ${svg(d < 0 ? 'none' : cat.icon, 'ico')}
      <span class="num">${d < 0 ? 'AUCUN' : '#' + d}</span>
      ${isCart ? '<span class="tag incart">Panier</span>' : worn ? '<span class="tag worn">Porté</span>' : ''}
      <span class="foot"><b>${d < 0 ? 'Gratuit' : money(cat.price)}</b><span class="live">Sur toi</span></span></button>`;
  }).join('') + (all.length > shown ? `<div class="more" id="more">Défile pour voir plus (${all.length - shown} restants)</div>` : '')
    + (all.length ? '' : '<div class="empty">Aucun modèle ne correspond.</div>');
  if (keepScroll) g.scrollTop = top; else g.scrollTop = 0;
  hydrate(g);
}
function renderDetail() {
  const el = $('#detail');
  if (!sel) { el.innerHTML = '<p style="color:var(--muted)">Choisis un modèle pour l\'essayer.</p>'; return; }
  const p = priceOf(cat, sel.d);
  const inCart = cart.get(cat.id);
  const same = inCart && inCart.drawable === sel.d && inCart.texture === sel.t;
  const worn = sel.d === cat.current.drawable && sel.t === cat.current.texture;
  const sws = Array.from({ length: sel.n }, (_, i) => `<button class="${i === sel.t ? 'on' : ''}" data-t="${i}" aria-label="Coloris ${i + 1}">${photo(cat, sel.d, i, 'thumb', true)}<span class="n">${i + 1}</span></button>`).join('');
  el.innerHTML = `<div class="drow"><div class="dname"><b>${esc(label(cat, sel.d))}<span class="badge-live">Sur toi</span></b><span>${sel.d < 0 ? 'Retire l\'accessoire porté' : `${sel.n} coloris disponible${sel.n > 1 ? 's' : ''}`}</span></div>
      <div class="price ${p ? '' : 'free'}">${p ? money(p) : 'Gratuit'}</div></div>
    ${sel.d >= 0 && sel.n > 1 ? `<div class="tex"><label>Coloris</label><button class="arrow" data-tstep="-1" aria-label="Coloris précédent">‹</button><div class="sw" id="sw">${sws}</div><button class="arrow" data-tstep="1" aria-label="Coloris suivant">›</button></div>` : '<div style="height:12px"></div>'}
    <button class="btn primary wide" id="add" ${same || (worn && !inCart) ? 'disabled' : ''}>${same ? '✓ Dans le panier' : worn && !inCart ? 'Tu le portes déjà' : inCart ? 'Remplacer dans le panier' : 'Ajouter au panier'}</button>`;
  hydrate(el);
  const on = el.querySelector('.sw .on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function renderCart() {
  const items = [...cart.values()];
  $('#cartN').textContent = items.length;
  $('#cartItems').innerHTML = items.length ? items.map((it) => {
    const c = catById(it.cat);
    return `<div class="ci"><span class="th">${svg(it.drawable < 0 ? 'none' : c.icon)}${photo(c, it.drawable, it.texture, 'thumb')}</span>
      <span class="tx" data-goto="${it.cat}"><b>${esc(label(c, it.drawable))}</b><span>${esc(c.label)}${it.drawable >= 0 ? ` · coloris ${it.texture + 1}` : ''}</span></span>
      <span class="p">${it.price ? money(it.price) : 'Gratuit'}</span><button class="rm" data-rm="${it.cat}" aria-label="Retirer du panier">✕</button></div>`;
  }).join('') : `<div class="cempty">Ton panier est vide.<br>Survole les vêtements à gauche pour les voir sur toi, puis « Ajouter au panier ».${S.itemsMode ? '<br><br>Chaque vêtement acheté arrive dans ton inventaire : tu le portes quand tu veux.' : ''}</div>`;
  hydrate($('#cartItems'));
  const total = items.reduce((a, b) => a + b.price, 0);
  const pays = S.payments.filter((k) => PAY[k]);
  if (!pays.includes(method)) method = pays[0];
  const short = (S.money[method] || 0) < total;
  const wearOpt = S.itemsMode ? `<label class="wear"><input type="checkbox" id="wearNow" ${wearNow ? 'checked' : ''}><span>Porter tout de suite<small>${wearNow ? 'Tes vêtements actuels iront dans ton inventaire.' : 'Les vêtements achetés iront dans ton inventaire.'}</small></span></label>` : '';
  $('#cartFoot').innerHTML = `<div class="total"><span>Total</span><b>${money(total)}</b></div>${wearOpt}
    <div class="pay">${pays.map((k) => `<button class="${k === method ? 'on' : ''} ${(S.money[k] || 0) < total ? 'short' : ''}" data-pay="${k}"><small>${PAY[k]}</small><b>${money(S.money[k])}</b></button>`).join('')}</div>
    ${items.length && short ? `<p class="warn">Solde ${PAY[method].toLowerCase()} insuffisant : il manque ${money(total - (S.money[method] || 0))}.</p>` : ''}
    <button class="btn primary wide" id="payBtn" ${!items.length || short || busy ? 'disabled' : ''}>${busy ? 'Paiement…' : items.length ? `Payer ${money(total)}` : 'Payer'}</button>`;
}
function renderTools() {
  const v = (id, l) => `<button class="${camView === id ? 'on' : ''}" data-view="${id}">${ico(id)}<span>${l}</span></button>`;
  $('#tools').innerHTML = `${v('full', 'Entier')}${v('head', 'Tête')}${v('torso', 'Haut')}${v('legs', 'Bas')}${v('feet', 'Pieds')}
    <span class="sep"></span><button data-rot="-1" aria-label="Pivoter à gauche">${ico('left')}</button><button data-rot="1" aria-label="Pivoter à droite">${ico('right')}</button>
    <span class="sep"></span><button class="${hands ? 'on' : ''}" data-hands="1">${ico('hands')}<span>Mains</span></button>`;
}
function renderAll() { renderRail(); renderGrid(); renderDetail(); renderCart(); renderTools(); }
// Centre de l'espace libre entre la boutique et le panier : la caméra y place le personnage
function sendLayout() {
  const W = window.innerWidth;
  const shop = document.querySelector('.shop').getBoundingClientRect();
  const cartEl = document.querySelector('.cart').getBoundingClientRect();
  const left = W > 760 ? shop.right : 0, right = W > 760 ? cartEl.left : W;
  const center = (left + right) / 2;
  post('layout', { frac: (center - W / 2) / (W / 2) });
}
window.addEventListener('resize', () => { if (S) sendLayout(); });

/* ---------- Actions ---------- */
function setView(v) { camView = v; post('view', { view: v }); renderTools(); }
async function chooseCat(id) {
  cat = catById(id);
  query = ''; $('#search').value = ''; shown = 60;
  const inCart = cart.get(id);
  const d = inCart ? inCart.drawable : cat.current.drawable, t = inCart ? inCart.texture : cat.current.texture;
  sel = { d, t, n: 1 };
  renderRail(); renderGrid();
  const r = await post('textures', { cat: id, drawable: d }) || {};
  sel.n = r.textures || sel.n;
  renderDetail();
  setView(CAM_OF[cat.cam] || 'full');
}
async function tryOn(d, t = 0) {
  const r = await post('try', { cat: cat.id, drawable: d, texture: t }) || {};
  sel = { d, t: r.texture ?? t, n: r.textures || 1 };
  renderGrid(true); renderDetail();
}
function addToCart() {
  if (!sel) return;
  cart.set(cat.id, { cat: cat.id, drawable: sel.d, texture: sel.t, price: priceOf(cat, sel.d) });
  toast(`${label(cat, sel.d)} ajouté au panier.`, 'ok');
  renderRail(); renderGrid(true); renderDetail(); renderCart();
}
function removeFromCart(id) {
  const c = catById(id);
  cart.delete(id);
  post('try', { cat: id, drawable: c.current.drawable, texture: c.current.texture });   // on remet ce qu'il portait
  if (cat.id === id) sel = { d: c.current.drawable, t: c.current.texture, n: sel ? sel.n : 1 };
  renderRail(); renderGrid(true); renderDetail(); renderCart();
}
function pay() {
  if (busy || !cart.size) return;
  busy = true; renderCart();
  post('pay', { method, wearNow, cart: [...cart.values()].map((x) => ({ cat: x.cat, drawable: x.drawable, texture: x.texture })) });
}
function askClose() {
  if (!cart.size) return doClose();
  $('#modal').innerHTML = `<div class="modal"><div class="mbox" role="dialog" aria-labelledby="mt"><h3 id="mt">Quitter sans payer ?</h3>
    <p>Les ${cart.size} article${cart.size > 1 ? 's' : ''} du panier ne seront pas achetés et tu retrouveras ta tenue d'avant.</p>
    <div class="row"><button class="btn ghost" data-m="stay">Rester</button><button class="btn primary" data-m="leave">Quitter</button></div></div></div>`;
  $('#modal [data-m=stay]').focus();
}
function doClose() { $('#modal').innerHTML = ''; post('close'); if (!IN_GAME) toast('Aperçu : en jeu, la boutique se ferme.', 'ok'); }
let toastT;
function toast(text, kind = '') { const t = $('#toast'); t.textContent = text; t.className = `toast on ${kind}`; clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- Événements ---------- */
$('#rail').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (b) chooseCat(b.dataset.cat); });
$('#grid').addEventListener('click', (e) => { const b = e.target.closest('[data-d]'); if (b) { hover = null; tryOn(Number(b.dataset.d), 0); } });

// Aperçu direct : survoler un modèle le montre tout de suite sur le personnage,
// quitter la grille remet le modèle choisi.
let hover = null, hoverT = null;
function liveBadge(on) { const b = document.querySelector('.badge-live'); if (b) b.style.visibility = on ? '' : 'hidden'; }
function preview(d, t) {
  liveBadge(!sel || sel.d === d);
  clearTimeout(hoverT);
  hoverT = setTimeout(() => post('try', { cat: cat.id, drawable: d, texture: t }), 70);
}
function endPreview() {
  if (hover === null) return;
  hover = null;
  document.querySelectorAll('.card.pv').forEach((c) => c.classList.remove('pv'));
  if (sel) preview(sel.d, sel.t);
}
$('#grid').addEventListener('mouseover', (e) => {
  const b = e.target.closest('[data-d]');
  if (!b) return;
  const d = Number(b.dataset.d);
  if (hover === d) return;
  document.querySelectorAll('.card.pv').forEach((c) => c.classList.remove('pv'));
  hover = d;
  b.classList.add('pv');
  if (!sel || sel.d !== d) preview(d, 0); else preview(sel.d, sel.t);
});
$('#grid').addEventListener('mouseleave', endPreview);
// Survol d'un coloris : aperçu de ce coloris
$('#detail').addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-t]');
  if (t && sel) { hover = sel.d; preview(sel.d, Number(t.dataset.t)); cardTexture(sel.d, Number(t.dataset.t)); }
});
$('#detail').addEventListener('mouseleave', () => { if (hover !== null) { hover = null; if (sel) { preview(sel.d, sel.t); cardTexture(sel.d, sel.t); } } });

// Flèches du clavier : passer d'un modèle à l'autre (aperçu immédiat)
function stepModel(delta) {
  const all = list(cat);
  if (!all.length) return;
  let i = all.indexOf(sel ? sel.d : all[0]);
  i = Math.max(0, Math.min(all.length - 1, (i < 0 ? 0 : i) + delta));
  if (i >= shown) { shown = i + 30; }
  tryOn(all[i], 0).then(() => { const c = document.querySelector(`.card[data-d="${all[i]}"]`); if (c) c.scrollIntoView({ block: 'nearest' }); });
}
$('#grid').addEventListener('scroll', (e) => {
  const g = e.target;
  if (g.scrollTop + g.clientHeight > g.scrollHeight - 200 && list(cat).length > shown) { shown += 60; renderGrid(true); }
});
$('#detail').addEventListener('click', (e) => {
  const t = e.target.closest('[data-t]'); if (t) return tryOn(sel.d, Number(t.dataset.t));
  const st = e.target.closest('[data-tstep]'); if (st) return tryOn(sel.d, (sel.t + Number(st.dataset.tstep) + sel.n) % sel.n);
  if (e.target.closest('#add')) addToCart();
});
$('#cartItems').addEventListener('click', (e) => {
  const r = e.target.closest('[data-rm]'); if (r) return removeFromCart(r.dataset.rm);
  const g = e.target.closest('[data-goto]'); if (g) chooseCat(g.dataset.goto);
});
$('#cartFoot').addEventListener('change', (e) => { if (e.target.id === 'wearNow') { wearNow = e.target.checked; renderCart(); } });
$('#cartFoot').addEventListener('click', (e) => {
  const p = e.target.closest('[data-pay]'); if (p) { method = p.dataset.pay; return renderCart(); }
  if (e.target.closest('#payBtn')) pay();
});
$('#tools').addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]'); if (v) return setView(v.dataset.view);
  const r = e.target.closest('[data-rot]'); if (r) return post('rotate', { delta: 45 * Number(r.dataset.rot) });
  if (e.target.closest('[data-hands]')) { hands = !hands; post('hands', { on: hands }); renderTools(); }
});
$('#search').addEventListener('input', (e) => { query = e.target.value.replace(/\D/g, ''); e.target.value = query; shown = 60; renderGrid(); });
$('#close').addEventListener('click', askClose);
$('#modal').addEventListener('click', (e) => {
  const m = e.target.closest('[data-m]'); if (!m) return;
  if (m.dataset.m === 'leave') doClose(); else $('#modal').innerHTML = '';
});

// Glisser sur la zone centrale pour tourner le personnage
let drag = null, acc = 0, rotT = null;
$('#stage').addEventListener('mousedown', (e) => { drag = e.clientX; $('#stage').classList.add('drag'); });
window.addEventListener('mouseup', () => { drag = null; $('#stage').classList.remove('drag'); });
window.addEventListener('mousemove', (e) => {
  if (drag === null) return;
  acc += (e.clientX - drag) * 0.6; drag = e.clientX;
  if (!rotT) rotT = setTimeout(() => { if (Math.abs(acc) > 0.5) post('rotate', { delta: acc }); acc = 0; rotT = null; }, 40);
});
document.addEventListener('keydown', (e) => {
  if ($('#app').classList.contains('hidden') || e.target.tagName === 'INPUT') { if (e.key === 'Escape' && e.target.tagName === 'INPUT') e.target.blur(); return; }
  if (e.key === 'Escape') { if ($('#modal').innerHTML) $('#modal').innerHTML = ''; else askClose(); }
  if (e.key === 'a' || e.key === 'q') post('rotate', { delta: -15 });
  if (e.key === 'e' || e.key === 'd') post('rotate', { delta: 15 });
  const cols = Math.max(1, Math.round($('#grid').clientWidth / 132));
  if (e.key === 'ArrowRight') { e.preventDefault(); stepModel(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepModel(-1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); stepModel(cols); }
  if (e.key === 'ArrowUp') { e.preventDefault(); stepModel(-cols); }
  if (e.key === 'Enter' && sel && $('#add') && !$('#add').disabled) addToCart();
});

window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.action === 'open') {
    S = { shop: m.shop, sex: m.sex, categories: m.categories, money: m.money || {}, payments: m.payments || ['cash', 'bank'], currency: m.currency || '$', images: m.images, itemsMode: !!m.itemsMode };
    IMG.setup(S.images);
    wearNow = false;
    cart.clear(); busy = false; hands = false; camView = 'full'; method = S.payments[0];
    $('#shopName').textContent = S.shop.name;
    $('#app').classList.remove('hidden', 'closing');
    $('#modal').innerHTML = '';
    cat = S.categories[0];
    renderAll(); sendLayout(); chooseCat(cat.id);
  }
  if (m.action === 'close') { $('#app').classList.add('closing'); setTimeout(() => $('#app').classList.add('hidden'), 250); }
  if (m.action === 'error') { busy = false; if (m.money) S.money = m.money; renderCart(); toast(m.text, 'err'); }
  if (m.action === 'paid') {
    $('#modal').innerHTML = `<div class="done"><div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3 3 7-7"/></svg><b>Merci pour ton achat !</b><span>${esc(m.text)}</span></div></div>`;
  }
});

/* ---------- Ma tenue ---------- */
let W = null;
function renderWardrobe() {
  if (!W) return;
  const names = W.names || {};
  $('#wList').innerHTML = W.list.map((c) => {
    const custom = !c.naked && names[c.id];
    const title = c.naked ? 'Rien' : custom || `${one(c)} n°${c.drawable}`;
    return `<div class="wi ${c.naked ? 'naked' : ''}"><span class="th">${svg(c.icon)}</span>
      <span class="tx"><b>${esc(title)}</b><span>${esc(c.label)}${c.naked ? '' : ` · coloris ${c.texture + 1}`}</span></span>
      ${W.itemsMode && !c.naked ? `<button class="mini gold" data-wren="${c.id}" data-name="${esc(custom || '')}">Renommer</button><button class="mini" data-woff="${c.id}" title="Ranger dans l'inventaire">Ranger</button>` : ''}</div>`;
  }).join('');
  $('#wFoot').innerHTML = W.itemsMode
    ? '« Ranger » met la pièce dans ton inventaire. Pour remettre un vêtement, utilise-le depuis ton inventaire : ce que tu portais à sa place y retourne. Le nom d\'un vêtement renommé le suit partout.'
    : 'Les vêtements en objets demandent elyzea_inventory.';
}
$('#wList').addEventListener('click', (e) => {
  const off = e.target.closest('[data-woff]'); if (off) { off.disabled = true; return post('unequip', { cat: off.dataset.woff }); }
  const rn = e.target.closest('[data-wren]'); if (rn) post('renameWorn', { cat: rn.dataset.wren, name: rn.dataset.name });
});
$('#wClose').addEventListener('click', () => { $('#wardrobe').classList.add('hidden'); W = null; post('wardrobeClose'); });

function openRename(name) {
  $('#rename').classList.remove('hidden');
  const i = $('#rnInput'); i.value = name || ''; $('#rnCount').textContent = `${i.value.length} / 32`;
  setTimeout(() => { i.focus(); i.select(); }, 30);
}
function closeRename(ok) {
  $('#rename').classList.add('hidden');
  post('renameDone', ok ? { name: $('#rnInput').value.trim() } : { cancel: true });
  if (!IN_GAME && ok) toast(`Aperçu : renommé en « ${$('#rnInput').value.trim() || 'nom d\'origine'} ».`, 'ok');
}
$('#rnInput').addEventListener('input', (e) => { $('#rnCount').textContent = `${e.target.value.length} / 32`; });
$('#rnInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') closeRename(true); if (e.key === 'Escape') closeRename(false); e.stopPropagation(); });
$('#rnOk').addEventListener('click', () => closeRename(true));
$('#rnCancel').addEventListener('click', () => closeRename(false));

window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.action === 'wardrobe') { W = m.data; $('#wardrobe').classList.remove('hidden'); renderWardrobe(); }
  if (m.action === 'wardrobeClose') { $('#wardrobe').classList.add('hidden'); W = null; }
  if (m.action === 'rename') openRename(m.name);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#wardrobe').classList.contains('hidden') && $('#rename').classList.contains('hidden')) {
    $('#wardrobe').classList.add('hidden'); W = null; post('wardrobeClose');
  }
});

/* ---------- Aperçu hors jeu ---------- */
let renameTarget = null;
function mock(ev, d) {
  if (ev === 'unequip' && W) { const c = W.list.find((x) => x.id === d.cat); if (c) { c.naked = true; delete W.names[d.cat]; } setTimeout(() => { renderWardrobe(); toast(`${one(c)} rangé dans ton inventaire.`, 'ok'); }, 300); }
  if (ev === 'renameWorn') { renameTarget = d.cat; openRename(d.name); }
  if (ev === 'renameDone' && renameTarget && W && !d.cancel) { if (d.name) W.names[renameTarget] = d.name; else delete W.names[renameTarget]; renameTarget = null; renderWardrobe(); }
  if (ev === 'try' || ev === 'textures') {
    const n = d.drawable < 0 ? 1 : 1 + ((d.drawable * 7 + 3) % 9);
    return { textures: n, texture: Math.min(d.texture || 0, n - 1) };
  }
  if (ev === 'pay') setTimeout(() => window.postMessage({ action: 'paid', text: 'Achat réglé : ' + money([...cart.values()].reduce((a, b) => a + b.price, 0)) + '.' }, '*'), 600);
  if (ev === 'close') setTimeout(() => window.postMessage({ action: 'open', ...DEMO }, '*'), 1200);
  return {};
}
const DEMO = {
  shop: { name: 'Ponsonbys', multiplier: 100 }, sex: 'male', currency: '$', payments: ['cash', 'bank'], money: { cash: 1840, bank: 26350 }, images: { enabled: false }, itemsMode: true,
  categories: [
    ['tops', 'Hauts', 'top', 'component', 392, 120, 'torso', 15], ['undershirts', 'T-shirts', 'tshirt', 'component', 188, 60, 'torso', 15],
    ['pants', 'Pantalons', 'pants', 'component', 172, 90, 'legs', 21], ['shoes', 'Chaussures', 'shoe', 'component', 131, 80, 'feet', 34],
    ['bags', 'Sacs', 'bag', 'component', 110, 150, 'back', 0], ['vests', 'Gilets', 'vest', 'component', 58, 110, 'torso', 0],
    ['arms', 'Gants et bras', 'glove', 'component', 196, 40, 'torso', 15], ['chains', 'Colliers, cravates', 'chain', 'component', 152, 70, 'torso', 0],
    ['masks', 'Masques', 'mask', 'component', 207, 100, 'head', 0], ['hats', 'Chapeaux', 'hat', 'prop', 186, 60, 'head', -1],
    ['glasses', 'Lunettes', 'glasses', 'prop', 49, 80, 'head', -1], ['ears', 'Boucles d\'oreilles', 'earring', 'prop', 41, 90, 'head', -1],
    ['watches', 'Montres', 'watch', 'prop', 44, 200, 'hand', -1], ['bracelets', 'Bracelets', 'bracelet', 'prop', 15, 70, 'hand', -1],
  ].map(([id, label, icon, type, count, price, cam, cur]) => ({ id, label, icon, type, count, price, cam, current: { drawable: cur, texture: 0 }, blacklist: [] })),
};
if (!IN_GAME) {
  window.postMessage({ action: 'open', ...DEMO }, '*');
  // Barre d'aperçu : voir aussi le panneau « Ma tenue » (touche F3 en jeu)
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:40;display:flex;gap:6px';
  bar.innerHTML = '<button class="mini gold" id="demoShop">Boutique</button><button class="mini gold" id="demoW">Ma tenue (F3)</button>';
  document.body.appendChild(bar);
  $('#demoW').onclick = () => { $('#app').classList.add('hidden'); window.postMessage({ action: 'wardrobe', data: { itemsMode: true, names: { tops: 'Veste de mariage' }, list: DEMO.categories.map((c) => ({ id: c.id, label: c.label, icon: c.icon, drawable: c.current.drawable < 0 ? -1 : c.current.drawable + 7, texture: 2, naked: c.current.drawable < 0 || c.id === 'bags' || c.id === 'masks' })) } }, '*'); };
  $('#demoShop').onclick = () => { $('#wardrobe').classList.add('hidden'); window.postMessage({ action: 'open', ...DEMO }, '*'); };
}
</script>
</body>
</html>
