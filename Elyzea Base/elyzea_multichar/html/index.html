<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elyzea FA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;1,600;1,700;1,800;1,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
/* =====================================================================
   ELYZEA FA · MULTICHAR  (thème du logo : nuit, violet néon, E blanc)
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--ely-ink); color: var(--ely-white); font-family: var(--ely-font); user-select: none; cursor: none; }
button { font: inherit; color: inherit; cursor: none; }

#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.city { position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none; opacity: .95; transition: opacity .8s; }
.city .ely-skyline { height: 100%; }
.city::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, rgba(7, 4, 15, .2) 40%, rgba(7, 4, 15, .95) 100%); }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .8) 100%); transition: opacity .8s; }
body.in-game.selecting #bg, body.in-game.selecting .vignette { opacity: 0; transition: opacity .6s; }
body.in-game.selecting .city { opacity: .45; }

.stage { position: fixed; inset: 0; opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s .7s; }
.stage.on { opacity: 1; visibility: visible; transition: opacity .7s ease; }

/* ---------- INTRO ---------- */
#intro { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; }
.intro-logo { position: relative; display: grid; place-items: center; }
.intro-logo .ring { position: absolute; width: min(46vh, 520px); aspect-ratio: 1; }
.intro-logo .ring:nth-child(2) { width: min(54vh, 600px); animation-duration: 26s; animation-direction: reverse; border-left-color: rgba(201, 166, 255, .25); }
.intro-logo .ely-mark { width: min(34vh, 380px); height: auto; filter: drop-shadow(0 0 30px rgba(155, 92, 255, .45)); }
.intro-word { font-size: clamp(34px, 7vh, 84px); margin-top: -1vh; }
.intro-word span { display: inline-block; opacity: 0; transform: translateY(.4em) skewX(-8deg); animation: letter .6s var(--ely-ease) forwards; }
@keyframes letter { to { opacity: 1; transform: none; } }
.intro-line { width: min(46vw, 560px); height: 2px; background: linear-gradient(90deg, transparent, var(--ely-violet-hi), transparent); transform: scaleX(0); animation: line 1.2s 1.6s var(--ely-ease) forwards; }
@keyframes line { to { transform: scaleX(1); } }
.enter { position: relative; margin-top: 1vh; padding: 16px 46px; border-radius: 14px; border: 1px solid var(--ely-line-hi);
  background: linear-gradient(120deg, rgba(155, 92, 255, .22), rgba(123, 47, 247, .08)); font: 800 italic 20px var(--ely-font-display);
  letter-spacing: .18em; text-transform: uppercase; opacity: 0; animation: fadeUp .8s 2.1s var(--ely-ease) forwards, glowBtn 2.6s 3s ease-in-out infinite; }
.enter:hover { background: linear-gradient(120deg, rgba(155, 92, 255, .45), rgba(123, 47, 247, .25)); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes glowBtn { 0%, 100% { box-shadow: 0 0 0 rgba(155, 92, 255, 0); } 50% { box-shadow: 0 0 34px rgba(155, 92, 255, .55); } }
.intro-sub { color: var(--ely-muted); letter-spacing: .3em; text-transform: uppercase; font-size: 12px; opacity: 0; animation: fadeUp .8s 2.4s forwards; }

/* ---------- SÉLECTION ---------- */
#select { display: grid; grid-template-columns: minmax(300px, 380px) 1fr minmax(300px, 380px); gap: 2vw; padding: 4vh 3vw 6vh; }
.brand { position: fixed; left: 3vw; top: 3.2vh; display: flex; align-items: center; gap: 12px; z-index: 2; }
.brand .ely-mark { width: 74px; height: auto; }
.brand .ely-word { font-size: 26px; }
.brand small { display: block; color: var(--ely-muted); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; margin-top: 2px; }
.col { align-self: center; display: flex; flex-direction: column; gap: 14px; }
.col h2 { margin: 0 0 4px; font: 800 italic 14px var(--ely-font-display); letter-spacing: .3em; text-transform: uppercase; color: var(--ely-violet-hi); }

.char { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 16px; text-align: left;
  background: var(--ely-panel); border: 1px solid var(--ely-line); backdrop-filter: blur(12px); overflow: hidden;
  opacity: 0; transform: translateX(-24px); transition: transform .35s var(--ely-ease), border-color .25s, background .25s, opacity .4s; }
.char.in { opacity: 1; transform: none; }
.char::before { content: ''; position: absolute; left: 0; top: 14%; bottom: 14%; width: 3px; border-radius: 3px; background: var(--ely-violet); transform: scaleY(0); transition: transform .3s var(--ely-ease); }
.char:hover { border-color: var(--ely-line-hi); transform: translateX(4px); }
.char.active { background: linear-gradient(120deg, rgba(155, 92, 255, .28), rgba(30, 18, 58, .75)); border-color: rgba(201, 166, 255, .6); box-shadow: 0 0 30px rgba(123, 47, 247, .3); }
.char.active::before { transform: scaleY(1); }
.char .av { width: 50px; height: 50px; flex: none; border-radius: 14px; display: grid; place-items: center; font: 800 italic 19px var(--ely-font-display);
  background: linear-gradient(135deg, #B57BFF, #5B21B6); box-shadow: 0 6px 18px rgba(123, 47, 247, .4); }
.char.empty .av { background: rgba(155, 92, 255, .1); border: 1px dashed var(--ely-line-hi); box-shadow: none; font-size: 26px; color: var(--ely-violet-hi); }
.char .who { min-width: 0; flex: 1; }
.char .who b { display: block; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char .who span { display: block; color: var(--ely-muted); font-size: 13px; margin-top: 2px; }
.char .num { font: 800 italic 12px var(--ely-font-display); color: rgba(201, 166, 255, .55); letter-spacing: .1em; }

.center { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 2vh; }
.tag { text-align: center; }
.tag b { display: block; font: 800 italic clamp(22px, 3.4vh, 34px) var(--ely-font-display); letter-spacing: .06em; text-shadow: 0 4px 22px rgba(0, 0, 0, .7); }
.tag span { color: var(--ely-violet-hi); letter-spacing: .26em; text-transform: uppercase; font-size: 12px; }
.rotate { display: flex; gap: 12px; margin-top: 14px; }
.rotate button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--ely-line-hi); background: var(--ely-panel); font-size: 20px; backdrop-filter: blur(8px); }
.rotate button:hover { background: rgba(155, 92, 255, .35); }
.halo { position: absolute; bottom: 0; width: 280px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse, rgba(155, 92, 255, .45), transparent 70%); filter: blur(4px); animation: halo 3s ease-in-out infinite; pointer-events: none; }
@keyframes halo { 50% { transform: scale(1.12); opacity: .7; } }
.ghost-ped { width: min(200px, 16vw); aspect-ratio: 200/460; margin-bottom: 18px; opacity: .55; animation: float 4s ease-in-out infinite; }
body.in-game .ghost-ped { visibility: hidden; }
@keyframes float { 50% { transform: translateY(-8px); } }

.detail { padding: 24px; }
.detail .eyebrow { font: 800 italic 12px var(--ely-font-display); letter-spacing: .3em; text-transform: uppercase; color: var(--ely-violet-hi); }
.detail h3 { margin: 6px 0 2px; font: 800 italic 30px var(--ely-font-display); line-height: 1.05; }
.detail .job { color: var(--ely-muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
.stats div { padding: 12px; border-radius: 12px; background: rgba(155, 92, 255, .08); border: 1px solid var(--ely-line); }
.stats div.w { grid-column: span 2; }
.stats small { display: block; color: var(--ely-muted); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.stats b { display: block; font-size: 18px; margin-top: 3px; }
.play { width: 100%; padding: 16px; font: 800 italic 19px var(--ely-font-display); letter-spacing: .16em; text-transform: uppercase; border-radius: 14px; cursor: none; }
.detail .note { color: var(--ely-muted); font-size: 13px; line-height: 1.5; margin: 12px 0 18px; }
.swap-in { animation: swapIn .45s var(--ely-ease); }
@keyframes swapIn { from { opacity: 0; transform: translateY(10px); } }

/* ---------- CONNEXION ---------- */
#launch { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(ellipse at center, rgba(59, 15, 134, .35), var(--ely-ink) 70%); }
#launch .ely-mark { width: 180px; height: auto; }
#launch h3 { margin: 0; font: 700 italic 20px var(--ely-font-display); letter-spacing: .14em; }
.bar { width: 280px; height: 3px; border-radius: 3px; background: rgba(155, 92, 255, .2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 40%; background: var(--ely-grad); animation: load 1.2s ease-in-out infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

.flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(201, 166, 255, .9), rgba(123, 47, 247, .3) 40%, transparent 70%); opacity: 0; }
.flash.go { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
.toast { position: fixed; left: 50%; top: 4vh; transform: translate(-50%, -20px); padding: 12px 22px; border-radius: 12px; background: var(--ely-panel); border: 1px solid rgba(255, 77, 109, .5); opacity: 0; transition: .35s; z-index: 9; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.hud { position: fixed; right: 3vw; top: 3.2vh; display: flex; gap: 8px; z-index: 3; }
.hud button { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--ely-line); background: var(--ely-panel); font-size: 13px; }
#cursor { position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; z-index: 99;
  border-radius: 50%; border: 2px solid var(--ely-violet-hi); box-shadow: 0 0 14px rgba(155, 92, 255, .8); transition: width .15s, height .15s, margin .15s, background .15s; }
#cursor::after { content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff; }
#cursor.hit { width: 38px; height: 38px; margin: -19px 0 0 -19px; background: rgba(155, 92, 255, .18); }
#cursor.down { transform: scale(.85); }
.demo { position: fixed; left: 12px; bottom: 12px; z-index: 9; font-size: 12px; color: var(--ely-muted); }
.demo button { padding: 4px 9px; margin-left: 4px; border-radius: 6px; border: 1px solid var(--ely-line); background: var(--ely-panel); cursor: pointer; }
.demo button.act { border-color: var(--ely-violet); }
.in-game .demo { display: none; }

@media (max-width: 1000px) {
  #select { grid-template-columns: 1fr; overflow-y: auto; padding-top: 14vh; }
  .center { min-height: 46vh; order: 2; } .detail-col { order: 3; }
}
@media (prefers-reduced-motion: reduce) { .intro-word span, .enter, .intro-sub, .intro-line { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="city" id="city"></div>
<div class="vignette"></div>

<section class="stage on" id="intro" aria-label="Accueil">
  <div class="intro-logo"><div class="ely-arc ring"></div><div class="ely-arc ring"></div><div id="introMark"></div></div>
  <div class="intro-word ely-word" id="introWord"></div>
  <div class="intro-line"></div>
  <button class="enter" id="enterBtn">Entrer en ville</button>
  <div class="intro-sub">Roleplay · Los Santos</div>
</section>

<section class="stage" id="select" aria-label="Choix du personnage">
  <div class="brand"><div id="brandMark"></div><div><div class="ely-word">ELYZEA <b>FA</b></div><small>Choisis ton personnage</small></div></div>
  <div class="col" id="list"><h2>Mes personnages</h2></div>
  <div class="center">
    <div class="ghost-ped" id="ghost"></div>
    <div class="tag" id="pedTag"></div>
    <div class="rotate"><button aria-label="Tourner à gauche" data-r="-1">⟲</button><button aria-label="Tourner à droite" data-r="1">⟳</button></div>
    <div class="halo"></div>
  </div>
  <div class="col detail-col"><div class="ely-panel detail" id="detail"></div></div>
</section>

<section class="stage" id="launch" aria-live="polite">
  <div id="launchMark"></div>
  <h3 id="launchTxt">Connexion…</h3>
  <div class="bar"><i></i></div>
</section>

<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status"></div>
<div id="cursor" aria-hidden="true"></div>
<div class="hud"><button id="mute" aria-pressed="false">🔊 Son</button></div>
<div class="demo" id="demo">Aperçu : <button data-n="0">0 perso</button><button data-n="1" class="act">1 perso</button><button data-n="2">2 persos</button><button id="replay">↺ Intro</button></div>

<script src="brand.js"></script>
<script>
'use strict';
const RES = typeof GetParentResourceName === 'function' ? GetParentResourceName() : null;
const IN_GAME = !!RES || !!window.invokeNative;
if (IN_GAME) { document.body.classList.add('in-game'); document.body.style.display = 'none'; } // attend l'ordre du client Lua
const isHidden = () => document.body.style.display === 'none';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => new Intl.NumberFormat('fr-FR').format(n || 0) + ' $';
function nui(event, data = {}) {
  if (!RES) return;
  fetch(`https://${RES}/${event}`, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(data) }).catch(() => {});
}
const DEMO = [
  { id: 1, slot: 1, firstname: 'Léna', lastname: 'Duval', job: 'LSPD · Officier', cash: 1840, bank: 26350, lastPlayed: '02/11/2026 21:14' },
  { id: 2, slot: 2, firstname: 'Marco', lastname: 'Vidal', job: 'Sans emploi', cash: 320, bank: 4100, lastPlayed: '28/10/2026 18:02' },
];
let characters = [DEMO[0]], slots = 2, busy = false, activeSlot = 1;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Décor : emblème, ville ---------- */
$('city').innerHTML = Ely.skyline({ w: 1920, h: 320, seed: 11, lit: 0.22 });
$('brandMark').innerHTML = Ely.mark({ size: 74, live: true });
$('ghost').innerHTML = `<svg viewBox="0 0 200 460"><defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A6FF" stop-opacity=".7"/><stop offset="1" stop-color="#7B2FF7" stop-opacity=".1"/></linearGradient></defs>
  <g fill="url(#gp)" stroke="#C9A6FF" stroke-opacity=".6"><ellipse cx="100" cy="50" rx="27" ry="32"/><path d="M90 78h20v18h-20z"/><path d="M60 104Q100 90 140 104L150 196Q148 248 138 262L62 262Q52 248 50 196Z"/>
  <path d="M64 256L136 256L132 300L124 438Q122 452 108 452L104 452L102 306L98 306L96 452L92 452Q78 452 76 438L68 300Z"/></g></svg>`;
function playIntro() {
  $('introMark').innerHTML = Ely.mark({ size: 380, anim: true, live: true });
  const word = 'ELYZEA FA';
  $('introWord').innerHTML = [...word].map((ch, i) => `<span style="animation-delay:${0.9 + i * 0.07}s;${i >= 7 ? 'color:var(--ely-violet);text-shadow:0 0 18px rgba(155,92,255,.8)' : ''}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
  // relance les animations CSS de l'intro
  document.querySelectorAll('#intro .enter, #intro .intro-sub, #intro .intro-line').forEach((el) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
}

/* ---------- Sons (synthèse, aucun fichier) ---------- */
let AC = null, master = null, drone = null, muted = false;
function audio() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination); } catch (e) { AC = null; }
  return AC;
}
function tone(f, d = .1, type = 'sine', v = .05, slide = 0, delay = 0) {
  const ac = audio(); if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  hover: () => tone(1800, .03, 'sine', .03),
  blip: () => tone(1200, .04, 'triangle', .03),
  enter: () => { tone(110, 1, 'sawtooth', .07, -50); tone(660, .5, 'triangle', .06, 400, .1); tone(990, .7, 'sine', .05, 0, .3); },
  select: () => { tone(520, .08, 'triangle', .05); tone(780, .08, 'triangle', .05, 0, .08); tone(1170, .3, 'sine', .06, 0, .16); },
};
function startDrone() {
  const ac = audio(); if (!ac || drone) return;
  const g = ac.createGain(); g.gain.value = 0; g.connect(master);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.connect(g);
  [55, 82.4, 110.5].forEach((f, i) => { const o = ac.createOscillator(); o.type = i ? 'sawtooth' : 'sine'; o.frequency.value = f; o.detune.value = i * 7; o.connect(lp); o.start(); });
  g.gain.linearRampToValueAtTime(muted ? 0 : .06, ac.currentTime + 3); drone = g;
}
$('mute').onclick = (e) => {
  muted = !muted; e.currentTarget.textContent = muted ? '🔇 Muet' : '🔊 Son'; e.currentTarget.setAttribute('aria-pressed', muted);
  if (drone && AC) drone.gain.linearRampToValueAtTime(muted ? 0 : .06, AC.currentTime + .4);
};
['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, () => { audio(); startDrone(); }, { once: true }));

/* ---------- Fond : aurore violette, sol néon, particules (léger) ---------- */
const cv = $('bg'), cx = cv.getContext('2d');
let W, H, parts = [], t0 = performance.now();
function resize() {
  const DPR = IN_GAME ? 1 : Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  parts = Array.from({ length: Math.min(IN_GAME ? 60 : 110, Math.round(W * H / 16000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.8 + .3, v: Math.random() * .3 + .06 }));
}
addEventListener('resize', resize); resize();
function draw(now) {
  // Pause quand l'interface est cachée ou que le vrai personnage est affiché : zéro coût
  if (isHidden() || (IN_GAME && document.body.classList.contains('selecting'))) { setTimeout(() => requestAnimationFrame(draw), 300); return; }
  const t = (now - t0) / 1000;
  cx.fillStyle = '#07040F'; cx.fillRect(0, 0, W, H);
  let g = cx.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .42, Math.max(W, H) * .6);
  g.addColorStop(0, 'rgba(123,47,247,.30)'); g.addColorStop(.5, 'rgba(59,15,134,.18)'); g.addColorStop(1, 'rgba(7,4,15,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  // aurore qui ondule
  for (let k = 0; k < 2; k++) {
    cx.beginPath();
    for (let x = 0; x <= W; x += 24) { const y = H * (.22 + k * .1) + Math.sin(x / 260 + t * (.25 + k * .1)) * 40 + Math.sin(x / 90 + t * .6) * 8; x ? cx.lineTo(x, y) : cx.moveTo(x, y); }
    cx.strokeStyle = k ? 'rgba(201,166,255,.05)' : 'rgba(155,92,255,.07)'; cx.lineWidth = 70 - k * 30; cx.shadowColor = 'rgba(155,92,255,.6)'; cx.shadowBlur = 30; cx.stroke(); cx.shadowBlur = 0;
  }
  // sol néon en perspective
  const hz = H * .7, sp = reduce ? 0 : (t * 34) % 40;
  cx.lineWidth = 1;
  for (let i = 0; i < 18; i++) { const p = (i * 40 + sp) / 720, y = hz + (H - hz) * p * p; cx.strokeStyle = `rgba(155,92,255,${.03 + p * .14})`; cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
  for (let i = -14; i <= 14; i++) { const x = W / 2 + i * W * .05; cx.strokeStyle = 'rgba(155,92,255,.12)'; cx.beginPath(); cx.moveTo(W / 2 + i * 6, hz); cx.lineTo(W / 2 + (x - W / 2) * 4, H); cx.stroke(); }
  for (const p of parts) {
    if (!reduce) { p.y -= p.v; if (p.y < 0) { p.y = H; p.x = Math.random() * W; } }
    cx.fillStyle = `rgba(201,166,255,${.2 + p.s * .18})`; cx.fillRect(p.x, p.y, p.s, p.s);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- Étapes ---------- */
function show(id) { document.querySelectorAll('.stage').forEach((s) => s.classList.toggle('on', s.id === id)); }
window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.action === 'openSelect') {
    characters = d.characters || []; slots = Math.max(1, Math.min(8, Number(d.slots) || 2)); busy = false;
    document.body.style.display = '';
    if (AC && AC.state === 'suspended') AC.resume();
    if ($('select').classList.contains('on')) renderSelect();
    else if (d.skipIntro) { show('select'); renderSelect(); }
    else goIntro();
  }
  if (d.action === 'notify') toast(d.message);
  if (d.action === 'close') {
    document.body.style.display = 'none'; document.body.classList.remove('selecting');
    if (AC && AC.state === 'running') AC.suspend();
    show('intro');
  }
});
function goIntro() { busy = false; document.body.classList.remove('selecting'); show('intro'); playIntro(); }
$('enterBtn').addEventListener('mouseenter', SFX.hover);
$('enterBtn').addEventListener('click', () => {
  if (busy || !$('intro').classList.contains('on')) return;
  audio(); startDrone(); SFX.enter();
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  nui('enter');
  setTimeout(() => { show('select'); renderSelect(); }, 380);
});

const charOf = (n) => characters.find((x, i) => (x.slot ?? i + 1) === n);
function renderSelect() {
  if (!charOf(activeSlot)) { for (let n = 1; n <= slots; n++) if (charOf(n)) { activeSlot = n; break; } }
  const list = $('list');
  list.innerHTML = '<h2>Mes personnages</h2>';
  for (let n = 1; n <= slots; n++) {
    const c = charOf(n);
    const el = document.createElement('button');
    el.className = `char ${c ? '' : 'empty'}`; el.dataset.slot = n;
    el.innerHTML = c
      ? `<div class="av">${esc((c.firstname?.[0] || '') + (c.lastname?.[0] || ''))}</div><div class="who"><b>${esc(c.firstname)} ${esc(c.lastname)}</b><span>${esc(c.job || 'Sans emploi')}</span></div><span class="num">0${n}</span>`
      : `<div class="av">+</div><div class="who"><b>Emplacement libre</b><span>Créer un personnage</span></div><span class="num">0${n}</span>`;
    el.onclick = () => selectSlot(n);
    el.onmouseenter = SFX.hover;
    list.appendChild(el);
    setTimeout(() => { el.classList.add('in'); SFX.blip(); }, 120 + (n - 1) * 120);
  }
  document.body.classList.add('selecting');
  selectSlot(activeSlot, true);
}
function selectSlot(n, silent) {
  const changed = activeSlot !== n || silent;
  activeSlot = n;
  const c = charOf(n);
  document.querySelectorAll('.char').forEach((s) => s.classList.toggle('active', +s.dataset.slot === n));
  $('pedTag').innerHTML = c ? `<b>${esc(c.firstname)} ${esc(c.lastname)}</b><span>${esc(c.job || 'Sans emploi')}</span>` : '<b>Emplacement libre</b><span>Ton futur personnage</span>';
  $('ghost').style.opacity = c ? '' : '.2';
  const det = $('detail');
  det.innerHTML = c
    ? `<div class="eyebrow">Emplacement 0${n}</div><h3>${esc(c.firstname)}<br>${esc(c.lastname)}</h3><div class="job">${esc(c.job || 'Sans emploi')}</div>
       <div class="stats"><div><small>Liquide</small><b>${fmt(c.cash)}</b></div><div><small>Banque</small><b>${fmt(c.bank)}</b></div>
       <div class="w"><small>Dernière connexion</small><b>${esc(c.lastPlayed || '—')}</b></div></div>
       <button class="ely-btn play ely-shine" id="go">Jouer</button>`
    : `<div class="eyebrow">Emplacement 0${n}</div><h3>Nouveau<br>personnage</h3>
       <p class="note">Aucun personnage ici. Crée-le, choisis son apparence et écris ton histoire à Los Santos.</p>
       <button class="ely-btn play ghost" id="go">Créer mon personnage</button>`;
  det.classList.remove('swap-in'); void det.offsetWidth; det.classList.add('swap-in');
  $('go').onmouseenter = SFX.hover;
  $('go').onclick = () => c ? launch(`Connexion de ${c.firstname} ${c.lastname}…`, 'selectCharacter', { id: c.id, slot: n })
                            : launch('Ouverture de la création de personnage…', 'createCharacter', { slot: n });
  if (!silent) SFX.hover();
  if (changed) nui('previewCharacter', c ? { id: c.id, slot: n } : { slot: n, empty: true });
}
document.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { SFX.blip(); nui('rotateCharacter', { dir: +b.dataset.r }); });
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4000); }
function launch(txt, event, data) {
  if (busy) return; busy = true;
  SFX.select(); $('launchTxt').textContent = txt;
  $('launchMark').innerHTML = Ely.mark({ size: 180, anim: true, live: true });
  show('launch'); document.body.classList.remove('selecting');
  nui(event, data);
  if (!IN_GAME) setTimeout(() => { busy = false; show('select'); document.body.classList.add('selecting'); }, 2400);
}

/* ---------- Curseur ---------- */
(() => {
  const cur = $('cursor'); let x = innerWidth / 2, y = innerHeight / 2, raf = 0;
  const paint = () => { raf = 0; cur.style.left = x + 'px'; cur.style.top = y + 'px'; };
  addEventListener('mousemove', (e) => { x = e.clientX; y = e.clientY; if (!raf) raf = requestAnimationFrame(paint); cur.classList.toggle('hit', !!e.target.closest('button')); }, { passive: true });
  addEventListener('mousedown', () => cur.classList.add('down'));
  addEventListener('mouseup', () => cur.classList.remove('down'));
})();

/* ---------- Aperçu hors jeu ---------- */
document.querySelectorAll('#demo [data-n]').forEach((b) => b.onclick = () => {
  characters = DEMO.slice(0, +b.dataset.n);
  document.querySelectorAll('#demo [data-n]').forEach((x) => x.classList.toggle('act', x === b));
  if ($('select').classList.contains('on')) renderSelect();
});
$('replay').onclick = () => goIntro();
if (!IN_GAME) playIntro();
</script>
</body>
</html>
