<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elyzea — Chargement</title>

    <!-- Polices (Google Fonts). Si elles ne chargent pas, des polices de secours sont prévues dans style.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-booting">

    <!-- ================= ARRIÈRE-PLAN ================= -->
    <div class="stage" aria-hidden="true">
        <div class="slideshow" id="slideshow"></div>

        <div class="ambient ambient--legal"></div>
        <div class="ambient ambient--illegal"></div>
        <div class="ambient ambient--neutral"></div>

        <div class="shade"></div>
        <div class="sweep" id="sweep"></div>

        <div class="light-lines" id="lightLines">
            <span></span><span></span><span></span>
        </div>

        <canvas class="particles" id="particles"></canvas>
        <div class="grain" id="grain"></div>
        <div class="vignette" id="vignette"></div>
        <div class="letterbox" id="letterbox"><i></i><i></i></div>
    </div>

    <!-- ================= INTERFACE ================= -->
    <main class="ui">

        <!-- Haut -->
        <header class="topbar">
            <div class="tip" id="tip">
                <span class="tip__badge">Astuce</span>
                <p class="tip__text" id="tipText"></p>
            </div>
            <ul class="links" id="links"></ul>
        </header>

        <!-- Centre -->
        <section class="hero">
            <div class="emblem" id="emblem">
                <div class="emblem__beam emblem__beam--legal"></div>
                <div class="emblem__beam emblem__beam--illegal"></div>
                <div class="emblem__glow"></div>
                <svg class="emblem__ring" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#4f8cff"/>
                            <stop offset="50%" stop-color="#e9d3a1"/>
                            <stop offset="100%" stop-color="#ff2d43"/>
                        </linearGradient>
                    </defs>
                    <circle cx="100" cy="100" r="97" />
                </svg>
                <div class="emblem__logo">
                    <img id="logo" alt="Logo du serveur">
                    <span class="emblem__shine"></span>
                </div>
            </div>

            <div class="identity" id="identity">
                <h1 class="identity__name" id="serverName"></h1>
                <div class="identity__sub">
                    <span class="identity__rule"></span>
                    <span id="serverSubtitle"></span>
                    <span class="identity__rule"></span>
                </div>
                <p class="identity__slogan"><span id="slogan"></span><b class="caret"></b></p>
            </div>
        </section>

        <!-- Bas -->
        <footer class="bottombar">

            <!-- Légende de la photo -->
            <div class="caption" id="caption">
                <div class="caption__row">
                    <span class="caption__side" id="captionSide"></span>
                    <span class="caption__count" id="captionCount"></span>
                </div>
                <p class="caption__title" id="captionTitle"></p>
                <div class="caption__timer"><i id="captionTimer"></i></div>
            </div>

            <!-- Progression du chargement -->
            <div class="loader" id="loader">
                <div class="loader__head">
                    <div>
                        <p class="loader__title" id="loaderTitle"></p>
                        <p class="loader__status" id="loaderStatus"></p>
                    </div>
                    <p class="loader__pct"><span id="loaderPct">0</span><small>%</small></p>
                </div>
                <div class="loader__track">
                    <div class="loader__fill" id="loaderFill"><i class="loader__spark"></i></div>
                </div>
                <p class="loader__log" id="loaderLog"></p>
            </div>

            <!-- Lecteur musical -->
            <div class="player" id="player">
                <div class="player__top">
                    <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                    <div class="player__meta">
                        <p class="player__label" id="playerLabel">En lecture</p>
                        <p class="player__title" id="trackTitle">—</p>
                        <p class="player__artist" id="trackArtist"></p>
                    </div>
                </div>

                <div class="player__controls">
                    <div class="volume">
                        <button class="icon-btn" id="btnMute" title="Couper le son (M)" aria-label="Couper le son">
                            <svg viewBox="0 0 24 24" class="ico-vol"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
                            <svg viewBox="0 0 24 24" class="ico-muted"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
                        </button>
                        <div class="slider" id="volumeBar" role="slider" aria-label="Volume" tabindex="0">
                            <div class="slider__fill" id="volumeFill"></div>
                        </div>
                    </div>
                    <div class="player__buttons">
                        <button class="icon-btn" id="btnPrev" title="Précédent" aria-label="Morceau précédent">
                            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
                        </button>
                        <button class="play-btn" id="btnPlay" title="Lecture / Pause (Espace)" aria-label="Lecture">
                            <svg viewBox="0 0 24 24" class="ico-play"><path d="M8 5v14l11-7z"/></svg>
                            <svg viewBox="0 0 24 24" class="ico-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
                        </button>
                        <button class="icon-btn" id="btnNext" title="Suivant" aria-label="Morceau suivant">
                            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
                        </button>
                    </div>
                    <span></span>
                </div>

                <div class="seek">
                    <span class="seek__time" id="timeCurrent">00:00</span>
                    <div class="slider slider--seek" id="seekBar" role="slider" aria-label="Position" tabindex="0">
                        <div class="slider__buffer" id="seekBuffer"></div>
                        <div class="slider__fill" id="seekFill"></div>
                    </div>
                    <span class="seek__time" id="timeTotal">00:00</span>
                </div>

                <button class="unlock" id="unlock">Cliquer pour lancer la musique</button>
            </div>
        </footer>
    </main>

    <!-- Écran noir d'entrée / de sortie -->
    <div class="curtain" id="curtain"></div>

    <audio id="audio" preload="auto"></audio>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
