<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elyzea FA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="phase-intro">
    <!-- ============ FOND ============ -->
    <div id="bg" class="bg" aria-hidden="true">
        <div id="slides" class="slides"></div>
        <div class="bg-tint"></div>
        <div class="aurora"><i></i><i></i><i></i></div>
    </div>
    <canvas id="grid" class="fx-grid" aria-hidden="true"></canvas>
    <div class="beams" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>

    <!-- ============ LOGO (vidéo) ============ -->
    <div id="stage" class="stage" aria-hidden="true">
        <div class="halo"></div>
        <div class="logo-wrap" id="logoWrap">
            <video id="logo" class="logo-video" muted playsinline preload="auto"></video>
            <div class="logo-sweep"></div>
        </div>
        <div class="ring" id="ring"></div>
        <div class="flash" id="flash"></div>
    </div>

    <!-- ============ INTERFACE ============ -->
    <main class="ui" id="ui">
        <!-- Cadre HUD -->
        <div class="hud-frame" aria-hidden="true"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>

        <header class="top">
            <div class="brand">
                <span class="dot"></span>
                <div><b id="srvName">ELYZEA FA</b><small id="srvTag">Roleplay</small></div>
            </div>
            <div class="top-right">
                <div class="clock" id="clock">00:00</div>
                <div class="links" id="links"></div>
            </div>
        </header>

        <section class="side">
            <div class="card tip-card">
                <div class="card-h"><span class="ico">✦</span>Astuce</div>
                <p id="tip" class="tip"></p>
                <div class="tip-bar"><i id="tipBar"></i></div>
            </div>
            <div class="card place-card">
                <div class="card-h"><span class="ico" id="placeIco">◆</span><span id="placeSide">Côté légal</span></div>
                <p id="placeTitle" class="place"></p>
            </div>
        </section>

        <section class="loader" aria-live="polite">
            <p class="slogan" id="slogan"></p>
            <div class="loader-row">
                <div class="loader-text">
                    <span class="loader-label">Chargement</span>
                    <span class="loader-status" id="status">Connexion au serveur</span>
                </div>
                <div class="pct"><span id="pct">0</span><small>%</small></div>
            </div>
            <div class="bar" id="bar">
                <div class="bar-fill" id="barFill"><i class="bar-spark"></i></div>
                <div class="bar-ticks"></div>
            </div>
            <ol class="steps" id="steps"></ol>
        </section>

        <aside class="player" id="player">
            <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="track"><b id="trTitle">—</b><small id="trArtist"></small></div>
            <div class="pl-btns">
                <button id="plPrev" aria-label="Précédente">⏮</button>
                <button id="plPlay" class="main" aria-label="Lecture / pause">⏸</button>
                <button id="plNext" aria-label="Suivante">⏭</button>
            </div>
            <input id="plVol" class="vol" type="range" min="0" max="100" aria-label="Volume">
        </aside>
    </main>

    <button id="skip" class="skip" type="button">Passer <kbd>Échap</kbd></button>

    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="exit" id="exit" aria-hidden="true"></div>

    <audio id="audio" preload="auto"></audio>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
