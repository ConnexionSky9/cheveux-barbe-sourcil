<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>elyzea_drogues</title>
<link rel="stylesheet" href="mg.css">
<style>
  :root { --c: 60, 200, 80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #e8eef9; user-select: none; overflow: hidden; }
  #card { position: fixed; right: 2.2vw; top: 50%; transform: translateY(-50%) translateX(20px); width: 21rem; opacity: 0; transition: .25s ease;
    background: linear-gradient(180deg, rgba(14, 22, 40, .97), rgba(9, 14, 26, .97)); border: 1px solid rgba(var(--c), .45); border-radius: 1rem;
    box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, .6), 0 0 2rem rgba(var(--c), .18); overflow: hidden; font-size: 14px; }
  #card.on { opacity: 1; transform: translateY(-50%); }
  #card::before { content: ''; display: block; height: 3px; background: linear-gradient(90deg, rgb(var(--c)), rgba(var(--c), .1)); }
  .head { display: flex; gap: .7rem; align-items: center; padding: .85rem 1rem .6rem; }
  .dot { width: 2.4rem; height: 2.4rem; border-radius: .7rem; display: grid; place-items: center; font-size: 1.3rem; background: rgba(var(--c), .18); border: 1px solid rgba(var(--c), .5); }
  .head b { display: block; font-size: 1rem; } .head small { color: rgb(var(--c)); text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; }
  .body { padding: .2rem 1rem 1rem; display: grid; gap: .65rem; }
  .row { display: flex; justify-content: space-between; font-size: .85rem; color: #93a3bf; } .row b { color: #e8eef9; }
  .bar { height: .5rem; background: rgba(148, 178, 230, .12); border-radius: 1rem; overflow: hidden; margin-top: .3rem; }
  .bar i { display: block; height: 100%; border-radius: 1rem; background: rgb(var(--c)); transition: width .4s; }
  .bar.water i { background: linear-gradient(90deg, #38bdf8, #0ea5e9); } .bar.hp i { background: linear-gradient(90deg, #ef4444, #f59e0b 50%, #22c55e); }
  .tags { display: flex; gap: .4rem; flex-wrap: wrap; } .tag { font-size: .72rem; padding: .15rem .5rem; border-radius: 1rem; border: 1px solid rgba(255,255,255,.14); color: #cbd5e1; }
  .tag.on { border-color: rgba(var(--c), .6); color: rgb(var(--c)); } .tag.bad { border-color: rgba(239,68,68,.6); color: #f87171; }
  .foot { font-size: .7rem; color: #64748b; padding: 0 1rem .8rem; }
</style></head>
<body>
<div id="card"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dur = (s) => { if (s === null || s === undefined) return '—'; s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} h ${String(m).padStart(2, '0')}` : m ? `${m} min` : `${s} s`; };
function show(i) {
  const card = $('#card');
  if (!i) { card.classList.remove('on'); return; }
  const c = i.color || [120, 140, 160];
  card.style.setProperty('--c', c.join(', '));
  const left = i.dead ? 'Plante morte' : !i.variety ? '—' : i.pct >= 100 ? 'Prête à récolter' : i.rate > 0 ? dur(i.timeLeft) : 'Ne pousse pas (lampe ?)';
  card.innerHTML = `<div class="head"><div class="dot">${i.variety ? '🌿' : '🪴'}</div><div><b>${esc(i.variety || 'Pot vide')}</b><small>${esc(i.stage)}</small></div></div>
    <div class="body">
      ${i.variety ? `<div><div class="row"><span>Croissance</span><b>${i.pct} %</b></div><div class="bar"><i style="width:${i.pct}%"></i></div></div>
      <div class="row"><span>Temps restant estimé</span><b>${esc(left)}</b></div>` : ''}
      <div><div class="row"><span>Eau</span><b>${i.water} %</b></div><div class="bar water"><i style="width:${i.water}%"></i></div></div>
      ${i.variety ? `<div><div class="row"><span>Santé</span><b>${i.health} %</b></div><div class="bar hp"><i style="width:${i.health}%"></i></div></div>` : ''}
      <div class="tags"><span class="tag ${i.lamp ? 'on' : ''}">💡 Lampe ${i.lamp ? 'installée' : 'absente'}</span>
        ${i.fert ? '<span class="tag on">🧴 Engrais</span>' : ''}<span class="tag ${i.dead || i.water <= 0 ? 'bad' : ''}">${esc(i.condition)}</span>
        ${i.mine ? '<span class="tag">À toi</span>' : ''}</div>
    </div><div class="foot">ALT sur le pot pour agir · cette fiche se ferme toute seule</div>`;
  card.classList.add('on');
}
window.addEventListener('message', (e) => { if (e.data && e.data.action === 'plant') show(e.data.info); });
if (typeof GetParentResourceName !== 'function' && !location.search.includes('mg')) show({ variety: 'White Widow', color: [170, 90, 230], stage: 'Croissance', pct: 62, timeLeft: 2700, water: 45, health: 92, lamp: true, fert: false, condition: 'a besoin d\'eau', mine: true, rate: 1 });
</script>
<script src="mg.js"></script>
<script src="mg_games1.js"></script>
<script src="mg_games2.js"></script>
</body></html>
