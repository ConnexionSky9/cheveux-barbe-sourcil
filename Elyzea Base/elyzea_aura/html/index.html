<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Elyzea Aura 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;700&family=Manrope:wght@400;500;600;700;800&family=Exo+2:ital,wght@1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="elypick.css">
  <link rel="stylesheet" href="lasergame.css">
  <link rel="stylesheet" href="maison.css">
  <link rel="stylesheet" href="fold.css">
</head>
<body>
  <div id="toasts" aria-live="polite"></div>
  <div id="yt-host" aria-hidden="true"></div>
  <div id="carplay" class="hidden"></div>

  <div id="stage" class="hidden">
    <div id="phone" data-frame="titane">
      <div class="edge-glow" aria-hidden="true"></div>
      <div class="edge-light" aria-hidden="true"></div>
      <button class="fold-btn" id="fold-btn" type="button" aria-label="Déplier le téléphone" title="Déplier / plier"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="2"/><path d="M14 6h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-5" stroke-dasharray="2 2.4"/></svg></button>
      <div class="side-btn side-btn--a" aria-hidden="true"></div>
      <div class="side-btn side-btn--b" aria-hidden="true"></div>
      <div class="side-btn side-btn--c" aria-hidden="true"></div>

      <div id="screen" data-theme="dark" data-icons="prisme">
        <div id="wp" aria-hidden="true"><div class="ely-wp" id="ely-wp"></div><div class="halo"></div></div>

        <div id="island" class="island"><div class="island__content"></div></div>

        <div class="statusbar">
          <span id="sb-time">00:00</span>
          <span class="statusbar__icons">
            <svg id="sb-lock" class="hidden" viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>
            <svg id="sb-plane" class="hidden" viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
            <svg id="sb-signal" viewBox="0 0 20 14" width="18" height="13"><rect x="0" y="9" width="3.5" height="5" rx="1" fill="currentColor"/><rect x="5.5" y="6" width="3.5" height="8" rx="1" fill="currentColor"/><rect x="11" y="3" width="3.5" height="11" rx="1" fill="currentColor"/><rect x="16.5" y="0" width="3.5" height="14" rx="1" fill="currentColor"/></svg>
            <svg viewBox="0 0 28 14" width="26" height="13"><rect x=".5" y=".5" width="23" height="13" rx="4" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="17" height="9" rx="2.5" fill="currentColor"/><rect x="25" y="4.5" width="2" height="5" rx="1" fill="currentColor" opacity=".5"/></svg>
          </span>
        </div>

        <section id="home" class="view view--home"></section>
        <section id="app" class="view view--app" aria-hidden="true"></section>
        <section id="lock" class="view view--lock" aria-hidden="true"></section>
        <section id="peek" class="view view--peek" aria-hidden="true"></section>
        <section id="call" class="view view--call" aria-hidden="true"></section>
        <section id="setup" class="view view--setup" aria-hidden="true"></section>

        <button class="home-bar" id="home-bar" aria-label="Accueil"></button>
      </div>
      <!-- Téléphone pliable : charnière + second écran (visible une fois déplié) -->
      <div class="hinge" aria-hidden="true"><i></i></div>
      <div id="screen2" class="screen2" data-theme="dark" data-icons="prisme" aria-hidden="true"></div>
    </div>
    <p class="peek-hint" id="peek-hint"></p>
  </div>

  <script src="brand.js"></script>
  <script src="cards.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/gameview.js"></script>
  <script src="js/system.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/social.js"></script>
  <script src="js/elypick.js"></script>
  <script src="js/media.js"></script>
  <script src="js/dating.js"></script>
  <script src="js/delivery.js"></script>
  <script src="js/mechanic.js"></script>
  <script src="js/garage.js"></script>
  <script src="js/carplay.js"></script>
  <script src="js/grossesse.js"></script>
  <script src="js/sante.js"></script>
  <script src="js/lasergame.js"></script>
  <script src="js/maison.js"></script>
  <script src="js/services.js"></script>
  <script src="js/identite.js"></script>
  <script src="js/main.js"></script>
  <script src="js/fold.js"></script>
</body>
</html>
